          [1, "Ask the vendor how they monitor AWS's security themselves", "Useful: the vendor should oversee its suppliers. But AWS's own report is the direct evidence."],
          [0, "AWS's controls were included in the testing and passed", "That would be the inclusive method. Carve-out means they were excluded."],
          [0, "Nothing: AWS is a huge provider, so it's safe to assume fine", "Size isn't assurance. Check what was tested."]] },
    { ev: "The exceptions section says: 'For 3 of 25 sampled terminated employees, access was removed 6 to 20 days after termination.'",
      ask: "How do you handle this?",
      o: [[0, "Reject the vendor outright because of the exceptions", "Exceptions are common. What matters is the impact and whether it's been fixed. Rejecting on reflex can block the business for no reason."],
          [0, "Ignore it: exceptions appear in most SOC 2 reports", "Normal doesn't mean irrelevant. Late leaver removal at a payroll provider could expose your staff's data."],
          [1, "Ask the vendor for a bridge letter covering the gap", "You'll want one for the 10 months since the period ended, but it doesn't answer this exception."],
          [2, "Assess the impact and ask what's been fixed since", "Treat exceptions as questions: how much it matters for your data, why it happened, and evidence that it's been fixed since."]] },
    { ev: "The report lists complementary user entity controls (CUECs), including: 'Customers are responsible for reviewing user access to the application quarterly' and 'enabling SSO and MFA'.",
      ask: "What does this mean for you?",
      o: [[2, "Your company has to run these controls itself", "The vendor's controls assume you do your part. Assign owners for the access reviews and SSO/MFA setup."],
          [1, "Write them into the contract and file it away", "Documenting them is good, but someone still has to actually perform them."],
          [0, "They're optional recommendations from the auditor", "They're conditions the auditor relied on. Without them, the controls may not achieve their goals."],
          [0, "The vendor's auditor will check them for you next year", "The vendor's auditor doesn't audit your company. These controls are yours."]] },
    { ev: "Procurement still wants to sign on Friday. Open points: the report is 10 months old and the exception fix hasn't been confirmed.",
      ask: "What do you recommend?",
      o: [[0, "Sign now: the opinion was unqualified, which is enough", "An unqualified opinion is good, but there are open gaps that someone should knowingly accept or close."],
          [1, "Delay signing until the next SOC 2 report in two months", "Safe, but it may hold the business up when there are quicker ways to close the gaps."],
          [2, "Sign with conditions, or have the risk owner decide", "Offer options: sign with conditions (a bridge letter, written confirmation of the fix, breach-notification and audit clauses, owners for the CUECs), or have the accountable risk owner formally accept the gaps. Make the risk visible rather than blocking or waving it through."],
          [0, "Block this vendor permanently and look for another one", "The findings don't justify a permanent ban. Present them in proportion."]] },
  ],
  lessons: ["Read the scope, period and opinion before the detail.",
            "Carve-out means you need the subservice organisation's own report. CUECs are your homework.",
            "Exceptions are questions about impact and fixes, not automatic rejections."],
  help: "Step 5: the decision belongs to the business risk owner. Junior analysts lay out the evidence and options, and escalate the decision rather than making it alone.",
  tell: "Third-party risk interviews reward structured thinking. Describe how you read a SOC 2 (scope, opinion, exceptions, CUECs) and how you framed the decision for the business. Coursework or a sample public report is fine; say which."
});

CASES.push({
  id: "big-upload", title: "The leaver's big upload", area: "Insider risk", m: "dfir", mins: 5,
  role: "Security analyst",
  brief: "A DLP alert: a sales manager who resigned last week, and leaves on Friday, uploaded 2.3 GB to a personal cloud storage account this morning.",
  steps: [
    { ev: "The alert gives the user, the destination domain and the total size.",
      ask: "What do you do first?",
      o: [[2, "Check what was uploaded before drawing any conclusions", "2.3 GB could be holiday photos or the customer database. Check file names, classification and source before anything else."],
          [1, "Block personal cloud storage sites for everyone at once", "Possibly a sensible control later, but it's a policy decision and doesn't tell you what was taken."],
          [0, "Call the employee and ask them why they did it", "That could tip them off and cut across HR and legal processes. Insider cases need care."],
          [0, "Lock their account and let their team know why", "Telling colleagues breaches confidentiality and could be unfair if the upload turns out to be innocent."]] },
    { ev: "The upload included a CRM export of 8,000 customer contacts and the pricing sheets, along with personal photos.",
      ask: "Who should you involve?",
      o: [[1, "The employee's line manager, directly and straight away", "They may need to know eventually, but bringing them in should go through HR, in case they're involved or conflicted."],
          [2, "The incident lead, who brings in HR and Legal", "Company data plus a departing employee is a sensitive investigation. HR and Legal shape what's fair and lawful."],
          [0, "No one: just block the site and keep an eye on them", "The data has already left. Blocking doesn't address what happens to it now."],
          [0, "Post it in the security team chat, naming the employee there", "Insider investigations are need-to-know. A wide chat channel risks the case and the person's rights."]] },
    { ev: "HR and Legal are involved. Legal asks you to preserve evidence.",
      ask: "What do you preserve?",
      o: [[0, "Nothing until the employee has actually left on Friday", "Logs roll over and laptops get reissued. Preserve it now."],
          [1, "A screenshot of the DLP alert, saved to the ticket", "Better than nothing, but not reliable evidence and far from complete."],
          [2, "The logs and a forensic image, with chain of custody", "DLP and proxy logs, the CRM's export audit log, and a forensic image of the laptop, kept with chain of custody, show what left, when and where, in a form that holds up if the case goes further."],
          [0, "Wipe the laptop so it's ready for the next starter", "Wiping the laptop destroys the main evidence before anyone has looked at it."]] },
    { ev: "HR wants to know whether the employee was allowed to have this data at all.",
      ask: "What do you check?",
      o: [[2, "Their access rights and the policies they agreed to", "Whether access was legitimate, and what the policies said about personal storage, decides how the case is handled."],
          [1, "Whether other sales staff copy data in the same way", "Useful context about culture or gaps, but it doesn't settle what this person was allowed to do."],
          [0, "Their recent performance reviews and any complaints", "Not relevant to whether the data handling was permitted."],
          [0, "Their personal social media accounts for any clues", "Out of scope, and potentially unlawful monitoring. Stick to company systems and policies."]] },
    { ev: "The case is handled through HR and Legal. Security is asked to reduce the risk in future.",
      ask: "Which change helps most?",
      o: [[1, "Ask leavers to sign a declaration that they've returned all data", "A useful legal step, but it doesn't stop the data leaving in the first place."],
          [2, "Extra monitoring and access checks once someone resigns", "The weeks after a resignation are the riskiest. Targeted monitoring, access reviews and blocking uploads of classified data to personal cloud catch problems without blanket surveillance."],
          [0, "Remove CRM export rights from everyone in the company", "Too broad: it would stop legitimate work. Limit exports by role and need."],
          [0, "Stop telling teams when someone has resigned", "Hiding resignations doesn't reduce data risk and makes handovers harder."]] },
  ],
  lessons: ["Get the facts before you assume intent.",
            "Insider cases are need-to-know and need HR and Legal from the start.",
            "Preserve evidence early and properly, with chain of custody."],
  help: "Step 2: once company data and a departing employee are involved, it's not a solo technical task. Bring in your manager and the incident lead, who involve HR and Legal.",
  tell: "Talk about process and discretion rather than people: 'I gathered the facts, involved HR and Legal through the incident lead and preserved evidence.' Keep it anonymous, and say if it came from a training scenario."
});

LEARN.push({
  id: "linux-services", track: "toolkit", m: "lnx", mins: 7, c: "green",

  blocks: [
    { t: "split", cols: [

        { t: "table", title: "Everyday admin commands", head: ["Command", "Use"], rows: [
          ["`systemctl status sshd`", "Is a service running?"], ["`journalctl -u sshd`", "That service's logs"], ["`ss -tln`", "Which ports are listening"], ["`df -h` / `free -h`", "Disk and memory"], ["`sudo apt update && sudo apt upgrade`", "Patch (Debian/Ubuntu)"]] },
      ]},

        { t: "lead", text: "**SSH** gives an encrypted remote shell. **VNC** shares a full desktop, but most VNC traffic isn't encrypted by default." },

          "Copy the public key to the server: `ssh-copy-id user@server`",
          "In /etc/ssh/sshd_config set `PasswordAuthentication no`",
          "Set `PermitRootLogin no` and limit users with `AllowUsers`",
          "Restart sshd, testing from a second session before you log out"],
          icons: [["key", "Key"], ["upload", "Copy"], ["lock", "No passwords"], ["user", "No root"], ["check", "Test"]] },
        { t: "callout", text: "Need VNC? Run it over an SSH tunnel so the session is encrypted, and never expose port 5900 to the internet." },
      ]},
    ]},
    { t: "table", title: "SERVICES AT A GLANCE", head: ["Service", "What it does", "Port", "Config", "Security tip"], rows: [
      ["SSH (sshd)", "Encrypted remote shell and file copy", "22", "/etc/ssh/sshd_config", "Keys only, no root login"],
      ["VNC", "Remote desktop", "5900 + display", "~/.vnc/", "Tunnel over SSH, strong password"],
      ["Samba", "Windows-compatible file shares (SMB)", "139, 445", "/etc/samba/smb.conf", "No guest shares; require SMB3"],
      ["Apache (httpd)", "Web server", "80, 443", "/etc/apache2/ or /etc/httpd/", "Hide version details, HTTPS only"],

        { t: "lead", text: "Label-based mandatory access control. On by default in RHEL, Fedora, Rocky and AlmaLinux." },
        { t: "list", items: ["Modes: enforcing, permissive, disabled", "`getenforce` and `sestatus` show the mode", "`ls -Z` shows a file's security label", "Fix wrong labels with `restorecon`", "Denials are logged in /var/log/audit/audit.log"] },
      ]},

LEARN.push({
  id: "sec-tools", track: "toolkit", m: "netsec", mins: 7, c: "red",
  title: "Security & testing tools",
  sub: "The defensive toolkit: what web-app testing, SAST/DAST, firewalls, IDS/IPS, honeypots and scanners each do.",

    { t: "split", cols: [

        { t: "grid", title: "", items: [

        { t: "list", items: ["No guarantee of delivery or order", "No handshake, almost no overhead", "Much faster and lighter", "App must handle any loss itself", "Used when speed beats perfection"] },

  { lvl: "j", m: "phys", q: "The 2023 breach at MGM Resorts reportedly began with attackers who:", a: "Phoned the IT help desk posing as an employee", w: ["Exploited a zero-day in the casino slot machines", "Broke into the data centre at night with cloned badges", "Brute-forced the corporate VPN over several months"], e: "Public reporting attributed it to Scattered Spider, using details found online to sound convincing. Strong identity checks before password or MFA resets are the key control." },

// Case files: investigation scenarios (data/14-cases-*.js).
const CASE_LIST = typeof CASES !== "undefined" ? CASES : [];
const CASE = {}; CASE_LIST.forEach(c => { CASE[c.id] = c; });

// Live connections (hosted build only): db handle, viewer id, and a promise that settles once live packs are loaded.
const LIVE = { db: null, uid: null };

// ---------- state ----------
// Web: each account has its own progress (server copy plus a cache on this device); guests keep

function freshState() {

const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };

    const snap = await ref.get();
    const remote = snap.exists ? snap.data() : null;
    if (!adopt(remote) && S.updatedAt) flushRemote();

}

// ---------- accounts (web) ----------
async function api(path, opts) {

async function pullAccount(offerImport) {

  renderSoft();
}

async function afterSignIn(user, recovery, fresh) {

  if (recovery) { VIEW = { screen: "recovery", code: recovery, fresh }; render(); return; }

}

  const then = AUTH_NEXT; AUTH_NEXT = null;
  VIEW = then === "cresult" && SESSION && SESSION.run ? { screen: "cresult" } : { screen: "home" };
  render(); window.scrollTo(0, 0);
  await pullAccount(true);

async function signOut() {

// ---------- progress helpers ----------

function level() { return LEVELS[S.settings.level] ? S.settings.level : "junior"; }

function poolIds(m) { const ids = m.ids.filter(inLevel); return ids.length ? ids : m.ids; }

function focusSet() { return new Set((S.settings.focus || []).filter(id => MOD[id])); }

  ids.forEach(id => { const s = S.q[id]; if (s) { seen++; mast += Math.min(s[0], 4) / 4; if (s[3] <= now) due++; if (s[0] === 0) wrong++; } });

}

function accuracy() { let s = 0, c = 0; Object.values(S.q).forEach(v => { s += v[1]; c += v[2]; }); return s ? Math.round(100 * c / s) : 0; }

}

let SESSION = null; let VIEW = { screen: "home" };
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

}

}

    const pool = Object.entries(S.q).filter(([id, v]) => QI[id] && v[1] > 0 && (v[0] === 0 || v[3] <= now)).sort((a, b) => a[1][0] - b[1][0] || a[1][3] - b[1][3]).map(x => x[0]);

  if (e.target.id === "importf" && e.target.files[0]) importData(e.target.files[0]);
});
document.addEventListener("submit", e => { const f = e.target; if (f && f.dataset && f.dataset.form) { e.preventDefault(); if (f.dataset.form === "delete" && !f.dataset.armed) { f.dataset.armed = "1"; const b = f.querySelector('button[type="submit"]'); b.textContent = "Tap again to delete for good"; setTimeout(() => { if (b.isConnected) { delete f.dataset.armed; b.textContent = "Delete my account"; } }, 5000); return; } submitAuth(f); } });
document.addEventListener("keydown", e => {
  if (e.target.id === "pname" && e.key === "Enter") { const b = document.querySelector('[data-act="post-score"]'); if (b) { e.preventDefault(); b.click(); } return; }
  if (VIEW.screen === "case" && CS && !CS.done && CS.i >= 0 && e.target.tagName !== "INPUT" && e.target.tagName !== "TEXTAREA" && !e.metaKey && !e.ctrlKey) {
    const k = e.key.toLowerCase(); const map = { "1": 0, "2": 1, "3": 2, "4": 3, a: 0, b: 1, c: 2, d: 3 };
    if (e.target.tagName === "BUTTON" && (k === "enter" || k === " ")) return;
    if (CS.picks[CS.i] == null && k in map) { e.preventDefault(); casePick(CS.orders[CS.i][map[k]]); }
    else if (CS.picks[CS.i] != null && (k === "enter" || k === "arrowright")) { e.preventDefault(); caseNext(); }
    return;
  }
  if ((VIEW.screen !== "quiz" && VIEW.screen !== "challenge") || !SESSION || e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey) return;
  const it = SESSION.items[SESSION.i]; const k = e.key.toLowerCase();
  if (e.target.tagName === "BUTTON" && (k === "enter" || k === " ")) return; const map = { "1": 0, "2": 1, "3": 2, "4": 3, a: 0, b: 1, c: 2, d: 3 };
  if (it.picked === null && k in map) { e.preventDefault(); answer(map[k]); }
  else if (it.picked !== null && (k === "enter" || k === " " || k === "arrowright")) { e.preventDefault(); next(); }
});

// ---------- boot ----------
// Deep links (?module=, ?star=1, ?play=challenge, #scoreboard...) are applied once, after sign-in if needed.
function route() {
  const R0 = PENDING_ROUTE || { search: "", hash: "" }; PENDING_ROUTE = null;
  if (MODE === "web" && (location.search || location.hash)) history.replaceState(null, "", "/");
  const p = new URLSearchParams(R0.search); const h = (R0.hash || "").replace(/^#/, "");
  const mod = p.get("module") || (h.startsWith("m-") ? h.slice(2) : "");
  if (["loading", "auth"].includes(VIEW.screen)) VIEW = { screen: "home" };
  if (p.get("drill") === "next" || h === "next") { startDrill("module", suggest().id); return; }
  if (mod && MOD[mod]) { VIEW = { screen: "module", mid: mod }; }
  else if (p.get("star") || h === "star") VIEW = { screen: "star" };
  else if (p.get("case") && CASE[p.get("case")]) { startCase(p.get("case")); return; }
  else if (p.get("cases") || h === "cases") VIEW = { screen: "cases" };
  else if (p.get("learn") && LESSON[p.get("learn")]) VIEW = { screen: "lesson", lid: p.get("learn") };
  else if (p.get("learn") != null || h === "learn") VIEW = { screen: "learn" };
  else if (p.get("play") === "challenge" || h === "challenge") { render(); startChallenge(); return; }
  else if (p.get("board") || h === "scoreboard") { VIEW = { screen: "board", tab: "month" }; loadBoard(true); }
  render();
}
if (MODE === "web") bootWeb();
else { route(); initRemote(); initAI(); }
})();

</script>
