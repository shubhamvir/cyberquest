  ["Who is the 'data controller'?", "The organisation that decides why and how data is processed", ["A firm that processes data on another's instructions", "The person the personal data is about", "The regulator that oversees data protection"], "The controller decides the purposes and means of processing. A processor acts on the controller's instructions, and the data subject is the individual."],
  ["A payroll company processes salary data for a client under contract. The payroll company is a:", "Processor", ["Controller", "Data subject", "Supervisory authority"], "It processes the data only on the client's instructions, so it's a processor. The client employer is the controller and must have an Article 28 contract in place."],
  ["Which GDPR principle says to collect only the data you actually need?", "Data minimisation", ["Storage limitation", "Purpose limitation", "Accountability"], "Data minimisation means personal data must be adequate, relevant and limited to what's necessary for the purpose."],
  ["Which GDPR principle says not to keep personal data longer than necessary?", "Storage limitation", ["Data minimisation", "Accuracy", "Lawfulness"], "Storage limitation requires retention periods and deleting or anonymising data once it's no longer needed for its purpose."],
  ["Which GDPR principle requires you to be able to show you comply?", "Accountability", ["Transparency", "Integrity", "Fairness"], "Accountability (Article 5(2)) means the controller must be able to demonstrate compliance, e.g. with records of processing, DPIAs, policies and training."],
  ["Under GDPR, valid consent must be:", "Freely given, specific, informed and unambiguous", ["Implied just by continuing to use the website", "Given once and then valid forever after", "Pre-ticked by default to save users time"], "Consent needs a clear affirmative action, must be as easy to withdraw as to give, and pre-ticked boxes don't count."],
  ["When must a controller tell affected individuals about a personal data breach?", "When it's likely to result in a high risk to them", ["For every single breach, within 24 hours", "Only after the regulator has agreed to it", "Never, because only the regulator is told"], "Article 34 requires telling individuals without undue delay when the breach is likely to cause high risk, so they can protect themselves."],
  ["What does a Data Protection Officer (DPO) do?", "Advises on and monitors data protection compliance", ["Approves every marketing email before it's sent", "Investigates data breaches on behalf of the police", "Owns and runs all of the company's databases"], "The DPO informs and advises, monitors compliance, advises on DPIAs and is the contact point for the regulator. They must be independent and not penalised for their role."],
  ["Does GDPR apply to a US company selling online to people in the EU?", "Yes, if it offers goods or services to people in the EU", ["No, it only applies to EU-based companies", "Only if it has an office in the EU", "Only if it has more than 250 staff"], "Article 3(2) extends GDPR to organisations outside the EU that offer goods or services to, or monitor the behaviour of, people in the EU."],
  ["Which of these is a data subject right under GDPR?", "Right to rectification", ["Right to see other users' data", "Right to choose the company's DPO", "Right to free storage of their data"], "Individuals can have inaccurate data corrected (Article 16). Other rights include access, erasure, restriction, portability and objection."],
  ["The right to data portability lets individuals:", "Get their data in a machine-readable format to reuse", ["Have all their data deleted after 30 days", "Block every marketing email forever", "See how the company's servers are built"], "Portability (Article 20) covers data the person provided, processed by consent or contract by automated means, in a structured, commonly used format."],
  ["What is a privacy notice?", "Information telling people how their data is used", ["A banner warning visitors about hackers", "A contract between two data processors", "A breach report sent to the regulator"], "Articles 13 and 14 require telling people who you are, why you process their data, the lawful basis, who receives it, how long it's kept and their rights."],
  ["Which is the BEST example of pseudonymisation?", "Replacing names with IDs and keeping the key separately", ["Deleting all of the records permanently", "Encrypting the whole hard drive with BitLocker", "Publishing the dataset with the names left blank"], "Pseudonymised data can be re-identified with the separately held key, so it's still personal data, but it lowers risk and supports security by design."],
  ["Truly anonymised data is treated under GDPR as:", "Outside GDPR, since no one can be identified", ["Still personal data in every case", "Special category data by default", "Usable only with explicit consent"], "If individuals can't be identified by any reasonably likely means, GDPR no longer applies. True anonymisation is hard; many 'anonymised' datasets are only pseudonymised."],
  ["An employee emails a spreadsheet of customer data to the wrong person. Is this a personal data breach?", "Yes, it's an unauthorised disclosure", ["No, because no hacker was involved", "No, because email is an internal tool", "Only if over 1,000 people are affected"], "A breach includes accidental disclosure, not just attacks. Record it, assess the risk and notify the regulator within 72 hours unless it's unlikely to result in risk."],
  ["Which lawful basis best fits processing an employee's bank details to pay their salary?", "Contract", ["Consent", "Vital interests", "Public task"], "Paying wages is necessary for the employment contract. Consent is a poor basis for employees because the power imbalance means it may not be freely given."],
  ["What is the EDPB?", "The EU body that keeps GDPR applied consistently", ["Ireland's national data protection regulator", "A certification for privacy professionals", "The EU's cybersecurity agency"], "The European Data Protection Board brings together national regulators, issues guidelines and settles disputes. Ireland's regulator is the DPC; the EU cyber agency is ENISA."],
  ["Under EU rules, non-essential cookies such as advertising trackers generally need:", "The user's prior consent", ["No consent if the site is EU-based", "Consent only after 30 days of use", "Just a notice in the website footer"], "The ePrivacy rules, read with GDPR's consent standard, require opt-in consent before setting non-essential cookies. Strictly necessary cookies are exempt."],
]});

QX.push({ m: "pci", q: [
  ["What does PCI DSS stand for?", "Payment Card Industry Data Security Standard", ["Personal Card Information Data Safety System", "Payment Compliance Institute Digital Security Scheme", "Public Card Infrastructure Data Standard Set"], "PCI DSS is the security standard for any organisation that stores, processes or transmits payment card data."],
  ["Who publishes and maintains PCI DSS?", "The PCI Security Standards Council", ["The European Central Bank", "ISO", "NIST"], "The PCI SSC (founded by the major card brands) publishes the standard. The card brands and acquiring banks enforce compliance."],
  ["What is the PAN?", "The primary account number on a card", ["The four-digit PIN used with the card", "The cardholder's name printed on it", "The three-digit security code on the back"], "The PAN is the long card number. If it's stored, processed or transmitted, PCI DSS applies, and it must be protected (e.g. masked, tokenised or encrypted)."],
  ["In PCI DSS, the cardholder data environment (CDE) is:", "People, processes and systems that handle card data", ["The bank's secure card printing facility", "A cloud region that Visa has approved for use", "Only the card payment terminal on a shop counter"], "The CDE includes anything that stores, processes or transmits card data, plus systems connected to it. Reducing the CDE reduces PCI scope."],
  ["A small online shop uses its provider's hosted payment page. Why does this help with PCI DSS?", "Card data never touches the shop's own servers", ["The shop becomes exempt from all security", "The provider pays any fines for the shop", "It means the shop needs no passwords"], "Outsourcing card capture shrinks scope dramatically (often to SAQ A), but the shop still has duties, such as protecting the page that links to the payment form."],
  ["Tokenisation replaces a card number with:", "A random value that's useless outside the system", ["A hash of the cardholder's name", "Only the last four digits of the card", "The card number written backwards"], "A token stands in for the PAN, and only the token vault can map it back. Keeping just the last four digits is truncation, which is different."],
  ["What is an ASV in PCI DSS?", "An approved firm that runs external vulnerability scans", ["A card brand's own in-house fraud investigator", "An internal auditor who works for the merchant", "A firewall product approved by the Council"], "Approved Scanning Vendors are certified by the PCI SSC to perform the quarterly external scans that PCI DSS requires."],
  ["PCI DSS requires that everyone with access to card data has:", "A unique user ID, not a shared account", ["A personal credit check each year", "A US government security clearance", "Their own payment card on file"], "Unique IDs make every action traceable to one person (Requirement 8). Shared or generic accounts are only allowed in tightly controlled exceptions."],
  ["Merchants are placed in PCI levels 1-4 mainly by:", "How many card transactions they process each year", ["How many employees they have on the payroll", "Their total annual revenue in euro", "How many physical shops they run in total"], "Card brands set merchant levels by annual transaction volume. Level 1 merchants (the largest) usually need an on-site assessment by a QSA."],
  ["Which form does a small merchant usually complete to self-report PCI DSS compliance?", "A Self-Assessment Questionnaire (SAQ)", ["A Report on Compliance (ROC)", "A SOC 2 Type II report", "An ISO 27001 Statement of Applicability"], "SAQs come in types (A, A-EP, B, C, D and so on) depending on how cards are taken. A ROC is written by a QSA for larger merchants or service providers."],
]});

QX.push({ m: "risk", q: [
  ["A basic risk matrix combines which two factors?", "Likelihood and impact", ["Cost and budget", "Threats and asset count", "Speed and accuracy"], "Risk is usually rated by how likely something is and how bad it would be. Plotting them on a matrix helps prioritise what to treat first."],
  ["What is inherent risk?", "Risk before any controls are applied", ["Risk left over after controls", "Risk passed to an insurer", "Risk the board has accepted"], "Inherent risk is the raw exposure. After controls it becomes residual risk, which is compared with the risk appetite."],
  ["Installing a firewall to lower the chance of an attack is which risk treatment?", "Mitigation (reduction)", ["Acceptance", "Transfer", "Avoidance"], "Adding controls reduces likelihood or impact. Transfer shares it (e.g. insurance), avoidance stops the activity, and acceptance knowingly keeps it."],
  ["What is a risk owner?", "The person accountable for managing a specific risk", ["The auditor who first found and reported the risk", "The attacker who is behind the threat", "The vendor that supplies the security controls"], "The risk owner has the authority to decide on treatment and accept residual risk. Usually a business manager, not the security team."],
  ["Why should risk assessments be repeated regularly?", "Threats, systems and the business change over time", ["Old assessments become illegal after a year", "Auditors charge less for new assessments", "Risks always go down when reassessed"], "New systems, suppliers, threats and incidents change the risk picture. Standards like ISO 27001 require reassessing at planned intervals and after significant changes."],
]});

QX.push({ m: "tprm", q: [
  ["What is third-party risk management (TPRM)?", "Managing risks that come from vendors and suppliers", ["Managing risks from the company's own staff", "Testing apps for bugs in third-party code", "Insuring buildings against natural disasters"], "TPRM covers assessing, contracting with, monitoring and offboarding vendors who access your data, systems or support critical services."],
  ["Why send a security questionnaire to a new vendor?", "To understand their controls before sharing data", ["To negotiate a lower price for the service", "To test their staff with phishing emails", "To avoid needing a written contract"], "Questionnaires (and evidence like SOC 2 or ISO 27001 reports) show how the vendor protects data, so risks can be addressed before signing."],
  ["Which vendor should get the deepest security review?", "A payroll provider holding all staff data", ["The office's coffee bean supplier", "A stationery delivery company", "The florist for reception"], "Reviews should be risk-based. A vendor handling sensitive data or a critical service gets the most scrutiny; low-risk suppliers need only a light check."],
  ["What is a Data Processing Agreement (DPA)?", "A contract setting how a processor handles personal data", ["A form that customers sign to give consent", "A list of all the company's databases", "A report sent to the data regulator"], "GDPR Article 28 requires a contract between controller and processor covering instructions, confidentiality, security, sub-processors, breach help and deletion."],
  ["How often should a high-risk vendor usually be reassessed?", "At least annually, or after major changes", ["Only once, when they are onboarded", "Every five years on renewal", "Only when the contract ends"], "Risk changes over time. High-risk vendors are usually reviewed yearly and again after incidents, acquisitions or service changes."],
  ["Which evidence best shows a vendor's security was independently checked?", "A recent SOC 2 Type II report or ISO 27001 certificate", ["The vendor's own marketing brochure", "A blog post the vendor wrote about security", "A list of the vendor's best-known customers"], "Independent assurance comes from a third party, such as a CPA firm (SOC 2) or an accredited certification body (ISO 27001). Check the scope and dates match the service you buy."],
]});

QX.push({ m: "eureg", q: [
  ["What is NIS2?", "An EU directive raising cyber rules for key sectors", ["An EU regulation on personal data privacy", "A US standard written for federal agencies", "An ISO standard for designing secure networks"], "NIS2 (Directive (EU) 2022/2555) sets cybersecurity risk management, incident reporting and governance duties for organisations in critical sectors."],
  ["NIS2 replaced which earlier EU law?", "The NIS Directive (2016)", ["GDPR", "The ePrivacy Directive", "The Cybersecurity Act"], "NIS2 repealed the original NIS Directive from 18 October 2024, widening the sectors covered and tightening requirements and enforcement."],
  ["By what date did EU member states have to transpose NIS2 into national law?", "17 October 2024", ["25 May 2018", "17 January 2025", "1 January 2030"], "The deadline was 17 October 2024, though many countries were late. 25 May 2018 is when GDPR applied, and 17 January 2025 is when DORA applied."],
  ["NIS2 sorts organisations into which two categories?", "Essential and important entities", ["Critical and non-critical operators", "Primary and secondary providers", "Large and small enterprises"], "Essential entities face proactive supervision and higher fines; important entities are supervised mainly after an issue arises. Both must meet the same core measures."],
  ["Which sector is covered by NIS2?", "Energy", ["Hair salons", "Independent bookshops", "Restaurants"], "NIS2 covers sectors such as energy, transport, banking, health, drinking water, digital infrastructure, public administration, postal services and some manufacturing."],
  ["Which of these is among the NIS2 Article 21 security measures?", "Multi-factor authentication where appropriate", ["Banning all use of cloud services", "Hiring an in-house hacking team", "Publishing every incident online"], "Article 21 lists measures including risk policies, incident handling, business continuity, supply chain security, cryptography, access control and MFA."],
  ["How does NIS2 relate to GDPR?", "NIS2 covers cyber resilience; GDPR covers personal data", ["NIS2 replaced GDPR when it took effect in 2024", "They are the same law under a new name", "GDPR now applies only in the NIS2 sectors"], "They overlap but have different aims. One incident can need reporting under both: to the CSIRT or authority under NIS2 and to the data protection regulator under GDPR."],
  ["What does DORA stand for?", "Digital Operational Resilience Act", ["Data Online Regulation Act", "Digital Office Risk Assessment", "Directive on Online Resilience Audits"], "DORA (Regulation (EU) 2022/2554) sets ICT risk and resilience rules for the EU financial sector."],
  ["DORA is an EU:", "Regulation that applies directly in every member state", ["Directive that each country must transpose", "Voluntary guideline written for banks", "ISO standard for financial companies"], "As a regulation, DORA applies as written across the EU, unlike NIS2, which is a directive turned into national laws."],
  ["Which organisation is MOST likely to fall under DORA?", "A bank or insurance company", ["A public hospital", "A water utility", "A university"], "DORA covers financial entities such as banks, insurers, investment firms and payment institutions, plus oversight of critical ICT providers. Hospitals and utilities fall under NIS2."],
  ["DORA's main pillars include ICT risk management, incident reporting, resilience testing and:", "ICT third-party risk", ["Anti-money laundering checks", "Employee pay transparency", "Carbon emissions reporting"], "DORA's pillars are ICT risk management, incident reporting, digital operational resilience testing, ICT third-party risk and information sharing."],
]});

QX.push({ m: "gov", q: [
  ["What is a procedure?", "Step-by-step instructions for carrying out a task", ["A high-level statement of management intent", "Optional good-practice advice", "A mandatory technical setting"], "Policies say what and why, standards set mandatory specifics, guidelines advise, and procedures explain step by step how to do something."],
  ["Why should every policy have an owner and a review date?", "So it stays current and someone is responsible", ["So it can be deleted after one year", "So staff know when to ignore it", "So auditors can skip reading it"], "An owner keeps the policy accurate and a review date makes sure it's updated as the business, technology and laws change."],
]});

QX.push({ m: "ics", q: [
  ["What does OT stand for in industrial security?", "Operational Technology", ["Online Telecommunications", "Office Tools", "Operating Terminal"], "OT is hardware and software that monitors and controls physical processes, such as factories, power grids, water treatment and building systems."],
  ["What is a PLC?", "A rugged computer that controls industrial machinery", ["A type of firewall built for factory networks", "A password manager made for plant engineers", "A cloud storage service for industrial data"], "A programmable logic controller reads sensors and drives motors, valves and pumps based on its program. Changing its logic changes the physical process."],
  ["What does a SCADA system do?", "Monitors and controls processes across wide areas", ["Scans corporate laptops for viruses and worms", "Manages the HR records for all plant staff", "Encrypts the email sent between engineers"], "SCADA gathers data from remote sites (pipelines, substations, pumping stations) and lets operators supervise and control them centrally."],
  ["What is an HMI in an industrial system?", "The screen operators use to view and control a process", ["A hardware key used for multi-factor login", "A network cable standard used in factories", "A backup copy of the PLC's control program"], "A human-machine interface shows process values and alarms and lets operators send commands. Compromised HMIs can be used to manipulate the process."],
  ["Why is it risky to connect OT devices directly to the internet?", "Many lack strong authentication and are easy to find", ["Internet connections make PLCs run slower", "OT devices can't use IP addresses at all", "It voids the device's electrical safety rating"], "Search engines like Shodan index exposed PLCs and HMIs. Many use default passwords or protocols with no authentication, as in several water utility attacks."],
  ["Why are IT and OT networks usually separated?", "To stop IT threats spreading into control systems", ["Because OT uses different electricity", "So OT staff can't read company email", "Because IT networks are always slower"], "Segmentation with a DMZ between IT and OT means ransomware or an attacker in the office network can't reach the controllers directly."],
]});

QX.push({ m: "phys", q: [
  ["Phishing by SMS text message is called:", "Smishing", ["Vishing", "Whaling", "Pharming"], "Smishing uses texts, vishing uses voice calls and whaling targets executives. Pharming redirects users to fake sites, e.g. through DNS poisoning."],
  ["You find an unlabelled USB stick in the office car park. What should you do?", "Hand it to IT or security without plugging it in", ["Plug it in to a work PC to find out who owns it", "Take it home and check it on a personal laptop", "Throw it away in the normal office bin"], "Dropped USB sticks are a classic baiting attack. Plugging one in can run malware. Security can examine it safely in an isolated system."],
]});

// Case files: investigation scenarios. Each step shows evidence, asks for the next move and grades
// every option: 2 = best move, 1 = reasonable but not best, 0 = poor. The next step's evidence
// assumes the best move was taken. All cases are fictional training scenarios.
// Fields: id, title, area, m (related module), mins, role, brief, steps[{ev, log?, ask, o:[[grade, text, why]]}],
// lessons[], help (when to seek help), tell (how to use it in an interview).
CASES.push({
  id: "travel", title: "The impossible commute", area: "SOC", m: "soc", mins: 6,
  role: "SOC analyst, day shift",
  brief: "Your SIEM raises an 'atypical travel' alert for a finance user, J. Murphy. Two successful sign-ins, 39 minutes apart, from two continents.",
  steps: [
    { ev: "The alert shows two sign-ins to the same account.",
      log: ["09:02  Sign-in  j.murphy  Dublin, IE     185.20.x.x  Success  MFA: app push approved",
            "09:41  Sign-in  j.murphy  Sao Paulo, BR  45.83.x.x   Success  MFA: satisfied by claim in token"],
      ask: "What do you check first?",
      o: [[2, "Check how the second sign-in passed MFA, and its device and IP", "'Satisfied by claim in token' means no new MFA prompt happened, which can point to a stolen session token. Details decide whether this is a VPN quirk or an attack."],
          [1, "Message the user on Teams to ask whether they're travelling", "Worth doing later, but if the account is compromised the attacker may be reading their messages. A call to a known phone number is safer."],
          [0, "Close it as a false positive, since VPNs cause this all the time", "VPNs do cause noise, but closing without looking at the evidence is how real compromises get missed."],
          [0, "Reset the user's password and close the alert as handled", "A password reset doesn't end an existing session token, and closing the alert stops the investigation before you know what happened."]] },
    { ev: "The Sao Paulo sign-in used the same session ID and browser as the Dublin one. The IP belongs to a hosting provider with recent abuse reports. The app was Exchange Online (email).",
      ask: "What does this suggest, and what do you check next?",
      o: [[1, "A misconfigured corporate VPN, so check the VPN gateway logs", "Ruling out the VPN is reasonable, but a reused session from an abused hosting IP points elsewhere."],
          [2, "A stolen session token: check recent emails and inbox rules", "AiTM kits proxy the real login page and steal the session cookie after MFA. Attackers then often add inbox rules to hide replies."],
          [0, "The user shared their password, so book them on training", "Training may help later, but it doesn't explain the evidence or find out what the attacker did."],
          [0, "Nothing conclusive yet, so wait and see if it happens again", "Waiting gives an attacker with mailbox access more time to commit fraud or spread."]] },
    { ev: "Mail trace: at 08:57 the user received 'DocuSign: Invoice 4471 pending' from a lookalike domain, and the link was clicked at 08:59. The audit log shows a new inbox rule at 09:44 moving any email containing 'invoice' or 'payment' to the RSS Feeds folder.",
      ask: "What's the most important thing to do now?",
      o: [[0, "Email the user to tell them their account is compromised", "The attacker is reading that mailbox. Use another channel, and let the incident lead decide on communications."],
          [1, "Delete the inbox rule and keep investigating quietly", "Removing the rule helps, but the attacker still holds a valid session and can create another."],
          [2, "Escalate to the incident lead and contain per the playbook", "This is now a confirmed compromise with fraud risk, so it's an incident. Containment means revoking sessions and tokens, resetting the password and removing the rule, then handing over to the incident lead."],
          [0, "Reset the password, then carry on with the timeline", "Without revoking sessions and refresh tokens, a stolen session can stay valid after a password change."]] },
    { ev: "Sessions revoked, password reset, rule removed. The same lure went to 23 other staff, and two of them also clicked.",
      ask: "What do you do next?",
      o: [[2, "Purge the email everywhere and check the two clickers' sign-ins", "Containment has to cover every recipient: purge the message, block the sender and URL, and check whether the two clickers were compromised the same way."],
          [1, "Send a company-wide warning about the phishing email first", "Useful, but only after purging it. A warning alone doesn't find the other victims."],
          [0, "Close the incident, since the first user is now contained", "Other people clicked the same link, so the incident isn't over."],
          [0, "Block all sign-ins from Brazil in conditional access policy", "Attackers can use an IP in any country. Location blocks don't fix stolen sessions."]] },
    { ev: "Sent items show that at 09:50 the attacker replied to a real supplier thread, asking finance to change the supplier's bank details.",
      ask: "Who needs to know right now?",
      o: [[0, "Only the supplier, by replying on the same email thread", "That thread is compromised. Contact the supplier on a phone number you already hold."],
          [2, "Finance, to hold payments, and the incident lead", "This is business email compromise. Stopping the payment is urgent, and the incident lead coordinates wider communications."],
          [1, "Your manager, at the end-of-shift handover meeting", "Your manager should know, but waiting until handover could let a fraudulent payment go through."],
          [0, "Nobody yet, until you've finished the full timeline", "Fraud risk is time-critical. Share what you know now and finish the timeline in parallel."]] },
  ],
  lessons: ["'Impossible travel' is often a VPN, so let evidence decide: how MFA was met, session IDs and IP reputation.",
            "A password reset alone doesn't remove a stolen session. Revoke sessions and tokens too.",
            "Look for what attackers do next in a mailbox: inbox rules and replies to payment threads."],
  help: "The moment to seek help was step 3: a confirmed malicious inbox rule plus a clicked phishing link meant a real compromise with fraud risk. Junior analysts contain within the playbook and hand over to the incident lead.",
  tell: "Evidence first ('the second sign-in reused the same session from a hosting IP'), then the next check you chose and why, then the point where you escalated. If you practised this in a lab or a training range, say so plainly."
});

CASES.push({
  id: "beacon", title: "The 60-second heartbeat", area: "Threat hunting", m: "ids", mins: 6,
  role: "SOC analyst, threat hunting",
  brief: "No alert fired, but while hunting through firewall and IDS logs you notice a finance laptop, FIN-LT-042, making very regular HTTPS connections to an unfamiliar domain.",
  steps: [
    { ev: "Three of many identical-looking connections.",
      log: ["10:00:02  FIN-LT-042 -> 203.0.113.50:443  TLS SNI=cdn-updates-sync.com  bytes_out=312",
            "10:01:02  FIN-LT-042 -> 203.0.113.50:443  TLS SNI=cdn-updates-sync.com  bytes_out=309",
            "10:02:03  FIN-LT-042 -> 203.0.113.50:443  TLS SNI=cdn-updates-sync.com  bytes_out=315"],
      ask: "What do you check first?",
      o: [[1, "Block the IP at the firewall straight away, just in case", "You may need to block it later, but blocking blind can tip off an attacker and you lose the chance to see which process is responsible."],
          [2, "The domain's age and reputation, and which other hosts use it", "A widely used update service would be contacted by many hosts and be years old. One host talking to a new domain on a fixed timer is a classic beacon pattern."],
          [0, "Nothing: it's HTTPS to a CDN-like name, so it's probably fine", "Encryption hides content, not intent. Most command-and-control traffic today is HTTPS."],
          [0, "Reimage the laptop now, to be safe, and close the ticket", "Reimaging destroys the evidence before you know what this is or how far it has spread."]] },
    { ev: "The domain was registered 9 days ago. Only FIN-LT-042 contacts it, and the server's TLS certificate is self-signed.",
      ask: "How do you find out what is making these connections?",
      o: [[1, "Capture the traffic with Wireshark and inspect the packets", "You'd see encrypted TLS and the same metadata you already have, but not which program sends it."],
          [1, "Run a full antivirus scan on the laptop and wait for it", "Harmless to run, but a clean scan doesn't prove anything. Many implants evade signature antivirus."],
          [2, "Ask EDR or Sysmon which process opens those connections", "Host telemetry links the network connection to a process, its file path, its parent and its signature."],
          [0, "Ask the user which websites they've been visiting lately", "The traffic runs every minute whether the user is browsing or not, so their answer won't explain it."]] },
    { ev: "EDR shows the connections come from C:\\Users\\amurphy\\AppData\\Roaming\\OneDriveUpdate\\odupd.exe. It's unsigned, it isn't in OneDrive's real install path, and it runs from a scheduled task created 3 days ago. It was first launched by WINWORD.EXE.",
      ask: "What does this tell you, and what now?",
      o: [[0, "It's OneDrive updating itself, so close the hunt as benign", "The real OneDrive is signed by Microsoft and installed elsewhere. A Word document launching it is a red flag."],
          [2, "Likely malware: isolate the host and escalate as an incident", "An unsigned binary posing as OneDrive, with scheduled-task persistence and a Word parent, is a confirmed incident. That's the point to hand to the incident lead."],
          [1, "Kill the process and delete the file, then keep an eye on it", "This removes the symptom but destroys evidence, leaves the persistence in place and skips the incident process."],
          [0, "Email the user to ask whether they installed it themselves", "If the machine is compromised, the attacker may see that email, and the user is unlikely to know anyway."]] },
    { ev: "The laptop is isolated; EDR still lets you reach it. The incident lead asks you to preserve evidence before anyone cleans up.",
      ask: "What should you preserve?",
      o: [[2, "Memory, the binary and hash, the scheduled task and the lure", "Memory, the binary and its hash, the persistence (scheduled task) and the original Word file together show what ran, how it stayed and how it got in. Memory may hold keys or settings that never touch disk."],
          [1, "Just the malware file itself, since that's what matters", "The file is important, but without memory, persistence details and the initial lure you can't reconstruct the attack."],
          [0, "Nothing: EDR has recorded it all, so reimage it right away", "EDR keeps limited telemetry, not full memory or disk. Once you reimage, that evidence is gone."],
          [0, "Screenshots of the desktop, Task Manager and the alert", "Screenshots aren't forensic evidence and miss almost everything that matters here."]] },
    { ev: "The hash isn't known publicly. The Word file arrived as 'Invoice_Q3.docm', emailed to five people in finance.",
      ask: "What's the best next step to scope the incident?",
      o: [[1, "Block the domain and IP at the firewall and web proxy", "Good containment, and you should do it, but on its own it doesn't tell you who else is infected."],
          [0, "Upload the sample to a public sandbox to get a verdict", "A targeted sample uploaded publicly can tip off the attacker and leak data. Search by hash and use a private sandbox."],
          [2, "Search every host and log for the hash, domain and IP", "Searching for these indicators of compromise across endpoints and proxy logs shows who else opened the file or is beaconing. Start with the other four recipients."],
          [0, "Wait for more alerts to show whether it has spread", "This implant raised no alert in the first place, so waiting for alerts won't find the others."]] },
  ],
  lessons: ["Beacons look like regular timing, similar small sizes and one host talking to a rare, new domain.",
            "Network data tells you something is wrong; host data (EDR, Sysmon) tells you which process.",
            "Preserve memory, the binary, persistence and the lure before cleanup, then scope with indicators of compromise."],
  help: "Step 3 was the hand-over point: once a confirmed malicious process was found, it stopped being a hunt and became an incident for the incident lead.",
  tell: "Hunting stories work well in interviews because they show reasoning without an alert to lean on. Walk through the clue you spotted, the check that confirmed it and when you escalated. If it came from a home lab, call it a lab."
});

CASES.push({
  id: "midnight-admin", title: "The 2 a.m. admin", area: "Windows", m: "win", mins: 6,
  role: "SOC analyst",
  brief: "A SIEM rule fires on file server FS01: a new account was added to the local Administrators group at 02:14.",
  steps: [
    { ev: "Windows Security events from FS01.",
      log: ["02:11  4624  Logon (type 3)       account: helpdesk.temp  source: 10.20.4.17",
            "02:13  4720  User account created  svc_backup2  by: helpdesk.temp",
            "02:14  4732  Added to Administrators  svc_backup2  by: helpdesk.temp"],
      ask: "What do you check first?",
      o: [[2, "Whether a change ticket or approved request covers it", "Admins do create accounts. An approved change separates planned work from an intruder, and the absence of one is itself evidence."],
          [1, "Ring the help desk lead to ask who helpdesk.temp is", "A good second check, but the change record is quicker and doesn't depend on someone being awake at 2 a.m."],
          [0, "Delete svc_backup2 straight away before it's used", "Deleting it destroys evidence and might break a legitimate job, before you know which it is."],
          [0, "Ignore it: service accounts get created all the time here", "Not usually at 2 a.m. by a temporary help desk account. That combination deserves a look."]] },
    { ev: "There's no change ticket. HR shows helpdesk.temp belonged to a contractor whose contract ended three weeks ago, but the account is still enabled. 10.20.4.17 is a VPN pool address.",
      ask: "What does this suggest?",
      o: [[1, "The contractor is back on a new contract: check with HR tomorrow", "Worth confirming, but there's no ticket, it's 2 a.m. and the account should have been disabled. Don't wait until morning to act."],
          [0, "A false positive from the SIEM's privileged-group rule", "The events are real, as the raw logs show. The question is whether the activity was authorised."],
          [0, "Routine overnight maintenance by the backup team", "Backups don't need a brand-new admin account created by an ex-contractor at night."],
          [2, "A forgotten leaver account being misused: escalate it", "An enabled account for someone who has left, used over VPN to create an admin at night, is a strong compromise signal. Escalate now."]] },
    { ev: "The incident lead agrees and asks you to find out what else these accounts did.",
      ask: "Where do you look?",
      o: [[0, "The contractor's old mailbox, for clues about their plans", "Mail may hold clues later, but it won't show what the accounts did on servers last night."],
          [1, "FS01's Security event log, since that's where it happened", "A good start, but attackers rarely stop at one server. You need the other systems too."],
          [2, "Logons across all servers, VPN logs, and processes on FS01", "Logon events show where the accounts went, VPN logs show where they came from, and process creation (4688 or Sysmon 1) on FS01 shows what they ran."],
          [0, "Email the contractor and wait to hear back from them", "If it isn't them, you've tipped off nobody useful. If it is them, you've warned them."]] },
    { ev: "At 02:20, svc_backup2 ran this on FS01:",
      log: ["vssadmin delete shadows /all /quiet"],
      ask: "Why does this matter so much?",
      o: [[2, "It often comes right before ransomware: contain now", "Attackers delete Volume Shadow Copies so victims can't roll files back. It's a well-known pre-encryption step (MITRE ATT&CK T1490)."],
          [1, "It may be backup software tidying up: check its logs first", "Checking is sensible in general, but with no change ticket and an ex-contractor account, containment shouldn't wait."],
          [0, "It's routine disk clean-up, so it's low priority for now", "Silently deleting every restore point isn't routine, especially from a brand-new admin account."],
          [0, "It means the attacker has finished and has already left", "Destroying recovery options usually comes before the damaging step, not after it."]] },
    { ev: "Both accounts are disabled and FS01 is isolated before any encryption starts. The incident lead asks what would stop this from happening again.",
      ask: "Which fix addresses the root cause?",
      o: [[1, "Require MFA for every VPN login, including contractors", "A strong control that would probably have stopped this login, but the root cause is leaver accounts staying active."],
          [2, "Disable accounts automatically from HR leaver dates", "The gap was in the joiner-mover-leaver process. Drive disabling from HR leaver dates, then review all enabled accounts for other leftovers."],
          [0, "Rename the local Administrators group on every server", "Attackers look groups up by their well-known identifiers, so renaming doesn't help."],
          [0, "Tell the help desk team to use much stronger passwords", "The problem wasn't password strength. The account shouldn't have existed at all."]] },
  ],
  lessons: ["Check for an approved change first: it quickly separates admin work from an intruder.",
            "Leaver accounts that stay enabled are a common way in. Compare HR dates with account status.",
            "Deleting shadow copies is a classic sign that ransomware is coming. Contain fast."],
  help: "Escalation came at step 2: no ticket, an account that should have been disabled, and admin rights created at night. You didn't need certainty to raise it, just enough evidence that it was unauthorised.",
  tell: "A good structure is 'What I saw, what I checked, why I escalated, what we changed afterwards'. Name the Event IDs, because interviewers like specifics. If it was a lab exercise, say it was a lab."
});

CASES.push({
  id: "lockd", title: "Monday morning, files locked", area: "Incident response", m: "ir", mins: 7,
  role: "Security analyst on the IR rota",
  brief: "08:10 Monday. Several users report that files on the shared S: drive now end in .lockd, and every folder has a README_RESTORE.txt.",
  steps: [
    { ev: "Three tickets in five minutes, all from different teams, all about the same share.",
      ask: "What do you do first?",
      o: [[0, "Restore last night's backup straight away to save time", "The attacker may still be active, and last night's backup could already be affected. Restoring now can lose more data."],
          [1, "Work out which machine is encrypting the share", "Important and urgent, but do it as part of the incident response, not instead of raising one."],
          [0, "Open the ransom note and contact the attackers for terms", "Any contact with criminals is a decision for leadership, legal and specialists, not a first step."],
          [2, "Escalate to the incident lead and open the playbook", "Ransomware is always a major incident. Raise it and start the ransomware playbook: getting the right people involved early matters more than anything you can do alone."]] },
    { ev: "The incident bridge is open. File server auditing shows the writes come from PC HR-PC-07, logged in as kbyrne.",
      ask: "How do you contain it?",
      o: [[2, "Isolate HR-PC-07 with EDR and disable kbyrne's account", "Network isolation through EDR stops the spread while keeping the PC powered on, so memory evidence survives. Disabling the account stops it being reused elsewhere."],
          [1, "Shut down the file server to stop the encryption", "It stops the damage but takes the share offline for everyone and loses memory evidence. Sometimes it's needed if isolation fails."],
          [0, "Ask kbyrne to restart their PC and log back in again", "A restart loses memory evidence and won't stop ransomware that persists, or that runs from somewhere else."],
          [0, "Unplug every computer in the building as fast as possible", "This causes maximum disruption without targeting the source, and it destroys evidence across the board."]] },
    { ev: "Encryption has stopped. EDR shows the ransomware reached HR-PC-07 over RDP from internal host JUMP-01, using the domain admin account adm_ops.",
      ask: "What does this change?",
      o: [[1, "Disable adm_ops, then carry on cleaning HR-PC-07", "Disabling it is needed, but it underestimates the problem: with domain admin, the attacker could be anywhere."],
          [2, "Assume the whole domain is compromised, not one PC", "Domain admin means the attacker could reach every machine, create accounts and plant persistence. Scoping and eviction now cover the whole domain, not just HR-PC-07."],
          [0, "Nothing: the infected PC is isolated, so the incident is over", "HR-PC-07 was just where the payload ran. The attacker came in through JUMP-01 with domain admin rights."],
          [0, "Reimage HR-PC-07 now so the user can get back to work", "That destroys evidence while the attacker may still be inside. Recovery comes after eviction."]] },
    { ev: "Backups: nightly to a domain-joined NAS, plus weekly immutable copies in the cloud. The NAS backup jobs were deleted at 03:00.",
      ask: "What do you plan to restore from?",
      o: [[0, "The NAS copy, because it's the most recent backup", "The attacker deleted the NAS jobs, so anything left there can't be trusted."],
          [2, "The immutable cloud copy, after the attacker is evicted", "Immutable backups can't be changed by the attacker. Restore only after eviction, or you'll be encrypted again."],
          [1, "Rebuild everything from scratch without restoring data", "Safe but costly. You'd lose data a clean immutable backup could give back."],
          [0, "Pay the ransom, since the NAS backups have been deleted", "You still have clean backups. Paying funds crime, may break sanctions rules and doesn't guarantee the data comes back."]] },
    { ev: "Legal asks whether anything has to be reported. The share held HR files with employees' personal data.",
      ask: "What applies?",
      o: [[2, "Treat it as a personal data breach and involve the DPO", "Losing access to personal data is a breach of availability, and ransomware gangs often steal data too. The DPO assesses the risk and decides on notifying the regulator within 72 hours of awareness."],
          [1, "Email every employee straight away to tell them what happened", "People may need to be told, but that decision depends on the risk to them and belongs to the DPO and incident lead."],
          [0, "No: the files never left our servers, so nothing was breached", "Under GDPR a breach includes losing availability, not only data being stolen."],
          [0, "Report it to the police, which covers all our obligations", "Reporting a crime is often a good idea, but it doesn't replace any data protection or NIS2 duties."]] },
  ],
  lessons: ["Escalate ransomware immediately: it's never a one-person job.",
            "Isolate rather than power off, to keep evidence, and assume a domain admin compromise reaches everywhere.",
            "Immutable or offline backups save you, but only restore after the attacker is gone."],
  help: "Step 1. Ransomware is the clearest case for seeking help immediately: the right move is to raise it and then do your part of the playbook.",
  tell: "If you've only seen ransomware in a tabletop exercise or lab, say that. 'In a tabletop exercise I played the analyst...' is honest and still shows the right instincts."
});

// Case files, part 2: Linux, cloud, vulnerability management and application security.
CASES.push({
  id: "cpu", title: "The server that never sleeps", area: "Linux", m: "lnx", mins: 6,
  role: "Junior security engineer",
  brief: "Monitoring alert: Ubuntu web server WEB-02 has been at 100% CPU for two hours. Web traffic is normal. You have SSH access.",
  steps: [
    { ev: "You log in over SSH.",
      ask: "What's your first command?",
      o: [[1, "tail -f the nginx access log to look for a traffic flood", "A sensible idea, but the alert already says traffic is normal. Find out what's using the CPU first."],
          [2, "ps aux --sort=-%cpu to see which process is using it", "Start with the symptom: which process, run by which user, from which path. top shows the same thing interactively."],
          [0, "sudo reboot to clear it and see if the load comes back", "A reboot destroys evidence, and if something has persistence the problem simply comes back."],
          [0, "sudo apt upgrade to patch everything before looking", "Patching matters, but it won't tell you what's running right now and could change evidence."]] },
    { ev: "The top of the process list:",
      log: ["PID   USER      %CPU  COMMAND",
            "4127  www-data  398   /tmp/.x/kswapd0 -o pool.example-mine.net:443"],
      ask: "What stands out?",
      o: [[2, "A fake 'kernel thread' running from /tmp as www-data", "Real kswapd0 is a kernel thread: ps shows it in [brackets] with no file path or arguments. This one runs from /tmp, belongs to www-data and points at a mining pool, so it's a disguised crypto-miner."],
          [0, "Normal kernel memory management, so the server needs more RAM", "The real kswapd0 doesn't run from /tmp, belong to www-data or take a mining-pool argument."],
          [1, "A heavy PHP job, so check cron for scheduled tasks", "Checking cron is useful later for persistence, but the process clearly isn't PHP."],
          [0, "A user's legitimate script, so leave it running for now", "Nobody legitimately hides a binary in /tmp/.x under the web server account."]] },
    { ev: "The process runs as www-data, the account the web server uses.",
      ask: "How did it most likely get there?",
      o: [[0, "It was installed by an unattended Ubuntu package update overnight", "Distribution packages don't install into a hidden folder in /tmp or connect to mining pools."],
          [1, "Someone guessed root's SSH password, so check auth.log", "Worth a look, but a root login would usually run things as root, not as www-data."],
          [2, "Via the web app: check web logs around the file's timestamp", "The owner, www-data, points at the web app, e.g. a vulnerable plugin or upload form. 'stat' gives the creation time to search the logs for."],
          [0, "There's no way to know, so skip the root cause and clean up", "Without the root cause, the attacker can come straight back the same way."]] },
    { ev: "stat shows the file was created at 02:14. The access log has a POST to /wp-content/plugins/old-gallery/upload.php at 02:13, then requests to /wp-content/uploads/sh.php. 'crontab -l -u www-data' shows '@reboot /tmp/.x/kswapd0'.",
      ask: "What's the right next move?",
      o: [[1, "Kill the process, delete /tmp/.x and the cron entry, carry on", "This removes the miner, but the web shell (sh.php) gave interactive access, so other backdoors may exist."],
          [0, "Block the mining pool's domain on the firewall and move on", "Stopping the payout doesn't remove the attacker's access to the server."],
          [2, "Escalate a web shell compromise and plan a clean rebuild", "A web shell (sh.php) let someone run any command as www-data. That's an incident: escalate, snapshot the server for evidence, then rebuild from known-good without the vulnerable plugin."],
          [0, "Change the WordPress admin password and enable MFA on it", "The attacker didn't need the admin password; they came in through a vulnerable upload."]] },
    { ev: "The server is rebuilt from a clean image without the old plugin. The team asks how to stop a repeat.",
      ask: "Which control would most likely have prevented this?",
      o: [[2, "Remove unused plugins and patch the rest promptly", "The way in was an old, vulnerable plugin. Removing what you don't use shrinks the attack surface."],
          [1, "Put a web application firewall in front of the site", "A good extra layer that may have blocked the upload, but it's no substitute for removing vulnerable code."],
          [0, "Set a longer root password", "Root's password wasn't involved in this attack."],
          [0, "Move the website to a different port", "Obscurity doesn't fix a vulnerable plugin. Scanners find every port."]] },
  ],
  lessons: ["Malware often borrows real process names. Check the path, owner and arguments.",
            "The process owner hints at the way in: www-data points at the web application.",
            "After a web shell, rebuild from clean instead of cleaning up, and remove the vulnerable component."],
  help: "Step 4: finding a web shell turns a CPU problem into a security incident. That's when you hand over, preserve evidence and agree the rebuild with the incident lead.",
  tell: "This is a great lab story: run a vulnerable WordPress VM, plant a harmless 'miner' and practise the hunt. In an interview, call it a lab and focus on the commands you chose and why."
});

CASES.push({
  id: "leaked-key", title: "A key on GitHub", area: "Cloud", m: "cloud", mins: 6,
  role: "Cloud security analyst",
  brief: "GitHub secret scanning emails you: an AWS access key (AKIA...7QX) was pushed to a public repository 40 minutes ago by one of your developers.",
  steps: [
    { ev: "The alert includes the key ID, the repository and the commit.",
      ask: "What do you do first?",
      o: [[0, "Make the repository private", "Bots scrape public repositories within minutes. The key has to be treated as already copied."],
          [2, "Deactivate the key in IAM now, then investigate", "Assume a public key is compromised. Deactivating it stops further use and is quickly reversible if needed."],
          [1, "Find out which IAM user owns the key and what it can do", "You'll need to know this, but every minute the key stays active is a minute an attacker can use it."],
          [0, "Wait to see if anything shows up on the AWS bill", "Billing lags by hours, and data theft doesn't show up on a bill at all."]] },
    { ev: "Key deactivated. It belonged to IAM user ci-deploy, which has the AdministratorAccess policy.",
      ask: "Where do you look for misuse?",
      o: [[2, "CloudTrail calls made with that key ID, in every region", "CloudTrail records who did what, from where and when. Attackers often use regions you don't normally watch."],
          [1, "GuardDuty findings for the account over the last day", "Helpful, as GuardDuty may already have flagged odd behaviour, but CloudTrail is the full record you need."],
          [0, "The developer's laptop: browser history, downloads and shell", "The question is what the key did in AWS, which only AWS's logs can tell you."],
          [0, "S3 server access logs for the main production bucket", "Too narrow: an admin key can touch IAM, EC2 and much more."]] },
    { ev: "CloudTrail filtered by the key ID:",
      log: ["11:52  us-east-1   CreateUser         userName=backup-admin   src=198.51.100.23",
            "11:52  us-east-1   AttachUserPolicy   AdministratorAccess",
            "11:53  us-east-1   CreateAccessKey    userName=backup-admin",
            "11:58  ap-south-1  RunInstances       c5.4xlarge x 20"],
      ask: "What do you conclude?",
      o: [[1, "Possibly a test by the developer: confirm with them before acting", "Confirming is fine, but an external IP creating an admin user is enough to act now, in parallel."],
          [0, "The CI pipeline scaling up its build servers for a release", "CI doesn't create new admin users from an unknown external IP or launch 20 large instances in an unused region."],
          [2, "An attacker used it, added a backdoor admin and is mining crypto", "A persistent backdoor plus resource abuse is a confirmed compromise. Bring in the incident lead."],
          [0, "Delete the instances in ap-south-1 and close the ticket", "Instances are the visible symptom. The backdoor user would let the attacker straight back in."]] },
    { ev: "The incident lead asks you to contain it fully.",
      ask: "What does full containment include?",
      o: [[1, "Terminate the 20 instances in ap-south-1 right away", "Necessary, but the backdoor admin user and its keys would still work."],
          [2, "Remove backup-admin, stop the instances, check all regions", "Remove the attacker's persistence (disable backup-admin and its keys), stop the abuse (terminate the instances) and sweep every region for anything else they created."],
          [0, "Delete the CloudTrail logs to save storage costs this month", "Those logs are your evidence. Never delete them during an incident."],
          [0, "Change the root user's password and turn on root MFA", "The attacker never used root. The problem is the IAM users and keys."]] },
    { ev: "Contained. Now the team asks how to prevent it.",
      ask: "What is the strongest prevention?",
      o: [[0, "Make every repository private, including the old ones", "This reduces exposure, but secrets in code still leak through clones, forks, laptops and insiders."],
          [1, "Rotate every access key automatically every 90 days", "Rotation limits a key's lifetime, but this key was abused within an hour of being leaked."],
          [2, "Use IAM roles for CI instead of long-lived access keys", "Short-lived credentials from IAM roles (for example via OIDC) mean there's no long-lived key to leak. Add least privilege to limit damage, and pre-commit secret scanning to catch mistakes."],
          [0, "Remind developers to be more careful with their commits", "Mistakes will happen anyway. Design controls so a slip doesn't become a breach."]] },
  ],
  lessons: ["A leaked key is compromised the moment it's public: revoke first, investigate second.",
            "CloudTrail is the record of what a key did. Check every region.",
            "Attackers add persistence (new users and keys) before abusing resources, so contain both."],
  help: "Step 3: CloudTrail proved misuse, including a backdoor admin user. You can deactivate the leaked key yourself at step 1; the wider incident needs a lead.",
  tell: "You can rehearse this safely in your own AWS free-tier account with a dummy, zero-permission key. Say 'in a sandbox account I...' so it's clear it was practice."
});

CASES.push({
  id: "vpn-cve", title: "Critical CVE, no patch yet", area: "Vulnerability management", m: "vuln", mins: 6,
  role: "Vulnerability management analyst",
  brief: "Monday 09:00. A vendor advisory describes a critical (CVSS 9.8) unauthenticated remote code execution flaw in your internet-facing VPN appliance model. CISA added it to the KEV catalog this morning. The patch is due in 5 days; the vendor offers a mitigation setting.",
  steps: [
    { ev: "You have the advisory and your asset inventory.",
      ask: "What do you do first?",
      o: [[0, "Wait for the patch: it'll go in with normal monthly patching", "KEV means it's being exploited in the wild. Five days on an internet-facing device is too long to do nothing."],
          [1, "Apply the vendor mitigation right away without checking", "Speed is right, but confirming your version takes minutes and avoids an unnecessary or wrong change."],
          [2, "Confirm your version is affected, then tell your manager", "Check the facts quickly, then raise it. A KEV-listed flaw on an edge device is a priority for the whole team."],
          [0, "Switch off the VPN for the whole company until the patch", "That might be right in an extreme case, but it's a business decision for management, not a first step."]] },
    { ev: "Your version is affected, and its management interface is reachable from the internet.",
      ask: "How do you get the mitigation in today?",
      o: [[2, "Raise an emergency change, then apply the mitigation", "Emergency change processes exist for exactly this: fast, but recorded and approved. Also restrict the management interface to cut exposure further."],
          [1, "Apply it now yourself and log the change afterwards", "Fast, but skipping approval risks an outage nobody planned for. A quick emergency approval protects you and the business."],
          [0, "Add it to the agenda of the monthly change advisory board", "Weeks away for an actively exploited flaw. That's what the emergency route is for."],
          [0, "Email staff asking them to avoid the VPN until it's patched", "The flaw is in the appliance itself, so attackers don't need staff to use the VPN."]] },
    { ev: "The mitigation went in at 13:00. The advisory lists files and log entries that indicate past exploitation.",
      ask: "Is applying the mitigation enough?",
      o: [[0, "Yes: the risk is handled, so close the ticket for now", "The flaw was public, and exploited, before you mitigated it. You need to know whether you were hit."],
          [1, "Yes, once a vulnerability scan confirms the mitigation works", "Verifying is good practice, but it says nothing about whether someone got in earlier."],
          [2, "No: check whether it was exploited before you mitigated", "Mitigation stops new attacks. Hunting for indicators tells you whether an attacker is already inside."],
          [0, "No: replace the appliance with another vendor's model today", "A huge change made in a panic. Find out whether you were compromised first."]] },
    { ev: "The vendor's integrity-check tool flags an unexpected file in the appliance's web directory, created two days ago.",
      ask: "What now?",
      o: [[2, "Treat it as a compromise and escalate to the incident lead", "An unexpected web file on an exploited edge device is typically a web shell. Escalate, preserve logs and an image, and assume VPN credentials were harvested, so plan resets."],
          [1, "Delete the file and run the integrity tool again to confirm", "Deleting removes evidence and probably not all of the attacker's access. This needs the incident process."],
          [0, "It's probably a false positive from the vendor's new tool", "Maybe, but you can't assume that on a device with a known, exploited flaw. Escalate and let the investigation decide."],
          [0, "Note it down and take another look on patch day", "If an attacker has a foothold, three more days is a gift to them."]] },
    { ev: "The incident is handled. The vendor patch is out.",
      ask: "What properly closes the vulnerability?",
      o: [[1, "Patch it and close the ticket once the update installs", "Close, but without verification and lessons learned, the same delay can happen next time."],
          [0, "Keep the mitigation in place and skip the patch entirely", "Mitigations are temporary and can be bypassed. The fix is the patch."],
          [0, "Patch it, but wait for the next quarterly patch window", "The device is still exposed to a known, exploited flaw. Patch it promptly."],
          [2, "Patch, rescan to verify, then review your response time", "Patching fixes it, a rescan proves it, recording the exposure window supports the incident record, and reviewing how quickly the advisory reached you improves next time."]] },
  ],
  lessons: ["KEV listing plus internet exposure equals urgent. CVSS alone isn't the whole story.",
            "No patch doesn't mean no action: mitigate through an emergency change and reduce exposure.",
            "After mitigating, hunt for signs of exploitation from before you acted."],
  help: "Two points: at step 1, raise a KEV-listed edge flaw with your manager straight away; at step 4, a suspicious file means it's an incident, not a patching task.",
  tell: "Interviewers love prioritisation stories. Explain why you ranked it as urgent (KEV, exposure), what you did before a patch existed, and how you checked for earlier compromise. Mark anything from coursework or a lab as such."
});

CASES.push({
  id: "idor", title: "Someone else's invoice", area: "AppSec", m: "web", mins: 5,
  role: "Application security analyst",
  brief: "A customer emails support: 'If I change the number at the end of my invoice link, I can see other people's invoices.' The ticket lands with you.",
  steps: [
    { ev: "The report has no screenshots and no exact URL.",
      ask: "What do you do first?",
      o: [[1, "Ask the customer for the exact steps and a screenshot", "Useful context, but you can reproduce it yourself, and a screenshot might contain another customer's data."],
          [0, "Try a few hundred real invoice IDs to see how much is exposed", "That means deliberately viewing real customers' personal data. Prove the flaw with test data instead."],
          [2, "Reproduce it safely with two test accounts you control", "Two accounts let you prove one can read the other's invoice without touching real customers' data."],
          [0, "Reply that it's impossible because the site uses HTTPS", "HTTPS protects data in transit. It does nothing to stop one logged-in user reading another's records."]] },
    { ev: "Test account A can open test account B's invoice by changing /invoice?id=58212 to 58213.",
      ask: "What kind of flaw is this?",
      o: [[2, "Insecure direct object reference (IDOR)", "The server trusts the ID in the request without checking ownership. IDOR is a form of broken access control, A01 in the OWASP Top 10 (2021)."],
          [1, "Missing authentication on the invoice page", "Close, but the user is logged in. What's missing is the authorisation check on each record."],
          [0, "SQL injection through the id parameter", "No query is being manipulated. A valid ID simply returns a record the user shouldn't see."],
          [0, "Reflected cross-site scripting (XSS)", "XSS runs script in a victim's browser. Here the server returns the wrong data."]] },
    { ev: "Invoices contain names, home addresses and the last four digits of payment cards. The endpoint has existed for 14 months.",
      ask: "Who needs to know now?",
      o: [[1, "The development team only, since it's a code bug", "They need to fix it, but personal data may have been exposed for over a year, which is a privacy matter too."],
          [2, "The app owner for a fix, plus security and the DPO", "A fix stops further exposure. Security and the DPO assess whether this is a reportable personal data breach, since names, addresses and partial card numbers were exposed for over a year."],
          [0, "Nobody until the fix has been deployed and tested", "Waiting could mean missing breach-reporting deadlines and delaying the fix."],
          [0, "Customers, via a notice on the public status page", "Disclosing an unfixed flaw publicly invites attackers. Communications come later and are decided by others."]] },
    { ev: "The development lead asks what the fix should be.",
      ask: "What's the right fix?",
      o: [[0, "Send the invoice ID in a POST body so it's not in the URL", "Attackers can change POST bodies just as easily as URLs."],
          [1, "Switch to random, unguessable invoice IDs (UUIDs)", "This makes guessing harder, which helps, but it's obscurity. The real fix is checking ownership."],
          [2, "Check server-side that each invoice belongs to the user", "Authorisation must be enforced on the server for every object: check the invoice belongs to the logged-in user. Then guessing IDs gets an attacker nothing."],
          [0, "Add a CAPTCHA to the invoice page to stop enumeration", "A CAPTCHA slows bots, but a person can still read other people's invoices."]] },
    { ev: "The fix is live. The DPO asks whether anyone abused the flaw before it was reported.",
      ask: "How do you find out?",
      o: [[2, "Search access logs for users opening invoices not their own", "Logs can show accounts reading many IDs, or IDs that belong to other customers. That decides how serious the breach is."],
          [1, "Ask customers whether they've noticed anything odd lately", "Customers usually can't tell that their invoice was viewed, so this won't give you an answer."],
          [0, "Assume nobody did, since no one else has complained", "Abuse of a flaw like this is silent, so a lack of complaints proves nothing."],
          [0, "Check the WAF logs for SQL injection alerts on that page", "IDOR requests look completely normal to a WAF. There's nothing for an injection rule to catch."]] },
  ],
  lessons: ["Prove the flaw with your own test accounts, not by browsing real customer data.",
            "IDOR is an authorisation problem. Fix it on the server for every object, not by hiding IDs.",
            "Personal data plus long exposure means bringing in the DPO early and checking logs for abuse."],
  help: "Step 3: once real personal data was involved and the flaw had been live for months, it became a privacy and incident question, not just a bug ticket.",
  tell: "You can practise IDOR safely on OWASP Juice Shop or PortSwigger's Web Security Academy labs. Say so in interviews: 'In PortSwigger's labs I found...' is honest and specific."
});

// Case files, part 3: audit, privacy, third-party assurance and insider risk.
CASES.push({
  id: "leaver-audit", title: "The leavers who never left", area: "ISO 27001 audit", m: "audit", mins: 6,
  role: "Internal auditor (ISO/IEC 27001)",
  brief: "You're auditing the access control process. The policy says accounts must be disabled within one working day of someone leaving.",
  steps: [
    { ev: "You have the policy and access to the HR and IT teams.",
      ask: "How do you test whether the control works?",
      o: [[0, "Read the policy and mark the control as effective", "A policy shows how things should work, not whether they do. You need evidence that it operates."],
          [1, "Ask the IT manager to walk you through how leavers are handled", "A good start for understanding the process, but asking alone is never enough evidence."],
          [2, "Sample HR's leavers list against account disable dates", "Comparing two independent sources tests whether the control actually happened, on time, for real leavers."],
          [0, "Check that every current employee has exactly one account", "That tests joiners, not leavers. The risk here is people who've gone but keep access."]] },
    { ev: "HR's list has 40 leavers; you pick 15. IT gives you a report of account statuses and disable dates.",
      ask: "Before you test, what do you check about IT's report?",
      o: [[2, "That it's complete and accurate, and how it was produced", "Evidence produced by the auditee must be checked before you rely on it: how and when it was generated, and that it covers every system in scope. An incomplete report can hide the very accounts you're looking for."],
          [1, "That it's in a spreadsheet format you can sort and filter", "Convenient, but the format doesn't make it trustworthy."],
          [0, "Nothing: IT produced it, so it can be relied on as it is", "Auditors keep professional scepticism. Reports can be filtered, out of date or wrong."],
          [0, "That it has been signed off by the IT manager", "A signature doesn't prove it's complete. Knowing how it was generated does."]] },
    { ev: "Results: 12 of 15 were disabled within a day. Two were disabled 9 and 14 days late. One account is still active two months after the person left, with a login three weeks after their leaving date.",
      ask: "How do you handle the active account with a login after leaving?",
      o: [[1, "Record it as a nonconformity in the final audit report", "It is a nonconformity, but a possible live security issue can't wait weeks for the report."],
          [2, "Raise it with management and security straight away", "Possible unauthorised access needs investigating now, not in a report weeks later. Escalate straight away, then record it formally as well."],
          [0, "Disable the account yourself, since you've found it", "Auditors stay independent and don't change the systems they audit. Ask the owners to act."],
          [0, "Ignore it: one account out of 15 is an acceptable error rate", "Any active leaver account with a recent login is a serious risk, whatever the percentage."]] },
    { ev: "Security investigates: the ex-employee logged in to check old payslips. The account is now disabled.",
      ask: "How do you grade the overall finding?",
      o: [[0, "An opportunity for improvement, not a nonconformity", "The policy requirement wasn't met, so this is a nonconformity, not just a suggestion."],
          [1, "A minor nonconformity, since it has been fixed now", "Fixing one account doesn't change how often the control failed. Grading reflects the failure, not the clean-up."],
          [2, "A nonconformity, likely major, given the failure rate", "Three failures in 15, one with actual use after leaving, suggests the control isn't working as a system. Final grading follows your audit methodology."],
          [0, "No finding, because the account has now been disabled", "The audit tests whether the control operated during the period. It didn't."]] },
    { ev: "The auditee proposes: 'We'll disable the account and remind IT about the policy.'",
      ask: "Is that enough?",
      o: [[2, "No: they need a root cause and a fix that you then verify", "Correction fixes this case. Corrective action removes the root cause (for example HR not telling IT, fixed with an automatic HR-to-IT leaver trigger), and your follow-up checks that it worked."],
          [1, "Yes, as long as they also re-check all 40 leavers this week", "Re-checking every leaver is a good correction, but it still doesn't fix why leavers slip through."],
          [0, "Yes: the account has been fixed, so the finding can close", "That's a correction for one instance. The process that caused it is unchanged."],
          [0, "No: the IT manager should be formally disciplined for it", "Audits look at process failures and root causes, not at punishing individuals."]] },
  ],
  lessons: ["Test controls with independent evidence: HR leavers compared with account data.",
            "Check that auditee-supplied reports are complete and accurate before relying on them.",
            "Correction is not corrective action: insist on a root cause, then verify the fix."],
  help: "Step 3: an audit can uncover a live risk. Possible unauthorised access goes to management and security straight away, not just into the report.",
  tell: "Audit stories show judgement. Explain how you sampled, what you checked about the evidence and why you escalated one item early. If it came from coursework or a mock audit, say so."
});

CASES.push({
  id: "wrong-sarah", title: "Wrong Sarah", area: "GDPR", m: "gdpr", mins: 5,
  role: "Privacy and compliance analyst",
  brief: "16:30 on a Friday. An HR officer tells you they emailed a spreadsheet with 120 employees' salaries and national ID numbers to an external recruiter by mistake. Autocomplete picked the wrong 'Sarah'.",
  steps: [
    { ev: "The HR officer is worried and wants to know what to do.",
      ask: "What happens first?",
      o: [[2, "Log it and tell the DPO or privacy team straight away", "The 72-hour clock starts when the organisation becomes aware. Logging it and bringing in the DPO immediately means the risk assessment starts in time."],
          [1, "Ask the recruiter to delete the email and confirm in writing", "Good containment, and it should happen, but alongside telling the DPO, not instead of it."],
          [0, "Leave it until Monday when the DPO is back in the office", "Waiting the weekend uses up most of the 72 hours and leaves the data out there."],
          [0, "Do nothing: the recruiter is a company you already trust", "Trust doesn't change the fact that personal data reached someone who shouldn't have it."]] },
    { ev: "The recruiter replies that they've deleted the email, including from deleted items, and confirms it in writing. The attachment wasn't encrypted or password-protected.",
      ask: "Is this a personal data breach?",
      o: [[0, "No, because it was an honest accident by a careful person", "Most breaches are accidents. GDPR covers accidental disclosure too."],
          [0, "No, because the recruiter has deleted it and confirmed so", "Deletion reduces the risk, but the disclosure still happened."],
          [1, "Possibly: it depends on whether the file was encrypted", "Encryption affects how risky it is and whether you must notify, not whether a breach happened."],
          [2, "Yes: personal data reached someone not entitled to it", "That's a breach of confidentiality. Record it either way; the next question is the risk to the people involved."]] },
    { ev: "The DPO starts the risk assessment.",
      ask: "Which factors matter most for deciding whether to notify the regulator?",
      o: [[2, "The data's sensitivity, how many people, and who got it", "Salaries plus national ID numbers for 120 people is sensitive. Fast, confirmed deletion by a known business lowers the risk but doesn't erase it."],
          [1, "Whether the recruiter's business is based inside the EU", "International transfer can matter, but it's not the main driver of risk here."],
          [0, "How senior the HR officer who sent the email is", "Who made the mistake doesn't change the risk to the people whose data was sent."],
          [0, "Whether it happened on a working day or at the weekend", "Timing affects your deadline, not how risky the breach is."]] },
    { ev: "The DPO decides to notify the regulator. National ID numbers can be used for identity fraud.",
      ask: "Do the 120 employees need to be told?",
      o: [[1, "Wait for the regulator's response before deciding anything", "The controller has to make this call itself, without undue delay. Waiting can leave people unprotected."],
          [2, "Probably yes, promptly, with advice on what to do", "When a breach is likely to result in high risk to people, they must be told without undue delay so they can protect themselves."],
          [0, "No, because the recruiter confirmed the deletion in writing", "Deletion helps, but with ID numbers involved, the DPO may still judge the risk to be high."],
          [0, "No: telling them would only cause worry and complaints", "Avoiding awkwardness isn't a lawful reason. Clear, calm communication with advice is the answer."]] },
    { ev: "The incident is closed with the regulator. HR asks how to stop it happening again.",
      ask: "What is the best prevention?",
      o: [[1, "Send the HR officer on refresher data protection training", "Training helps a little, but autocomplete mistakes happen to careful people too. Technical controls matter more."],
          [0, "Ban HR from sending any attachments by email at all", "Unworkable. Make the safe way the easy way instead."],
          [2, "Add external-recipient warnings and DLP for ID numbers", "External-recipient warnings and DLP rules catch the mistake before it leaves. Sharing sensitive files through access-controlled links, instead of attachments, makes a misdirected email harmless."],
          [0, "Discipline the HR officer in front of the team as a lesson", "Blame discourages people from reporting the next mistake quickly, which is exactly what you need."]] },
  ],
  lessons: ["Accidental disclosure is still a personal data breach. Record every one.",
            "The 72-hour clock starts at awareness, so tell the DPO immediately, even late on a Friday.",
            "Prevent repeats with controls that catch mistakes (warnings, DLP, links), not just training."],
  help: "Step 1: personal data incidents go to the DPO or privacy team straight away. Your job is to raise it quickly and help contain it, not to decide alone whether to notify.",
  tell: "GDPR interviews often ask 'What would you do if...?'. Walk through it: contain, tell the DPO, assess the risk, decide on notification, prevent a repeat. Be clear about what you've done for real and what you've practised."
});

CASES.push({
  id: "payroll-vendor", title: "Sign by Friday", area: "SOC 2 and third-party risk", m: "soc2", mins: 6,
  role: "Third-party risk analyst",
  brief: "Procurement wants to sign a new SaaS payroll vendor by Friday. The vendor has sent its SOC 2 Type II report, and you're asked to review it.",
  steps: [
    { ev: "A 70-page PDF lands in your inbox.",
      ask: "What do you check first?",
      o: [[1, "The list of controls the auditor tested and their results", "Important, but first make sure the report covers the right service and period."],
          [2, "The scope, the period covered and the auditor's opinion", "Check the scope, period and opinion first: does it cover the service you're buying, for a recent period, with an unqualified opinion? If not, the detail doesn't help you."],
          [0, "Which audit firm's logo is on the cover page of the report", "Check that it's a licensed CPA firm, but the logo tells you nothing about scope or results."],
          [0, "How many pages it has, as a sign of how thorough it was", "Length says nothing about coverage or quality."]] },
    { ev: "It covers the payroll platform, the period ended 10 months ago, and the opinion is unqualified. AWS is listed as a subservice organisation using the carve-out method.",
      ask: "What does the carve-out mean for you?",
      o: [[2, "AWS wasn't tested here, so you need AWS's own SOC 2 report", "Carve-out means the report excludes the subservice organisation's controls. You get that assurance from AWS's own report."],
