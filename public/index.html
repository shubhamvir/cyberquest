<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Cybersecurity MCQ drills, a monthly 50-question challenge with a scoreboard, spaced review and a STAR interview coach.">
<meta name="theme-color" content="#0F1A2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CyberQuest">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>CyberQuest</title>
<style>
/* Layout: ops-console dashboard. ID-badge header, ATT&CK-style module matrix (one column per domain), focused single-question card. */
:root{
  --bg:#E7EBF0; --surface:#FAFBFC; --surface-2:#EEF2F6; --ink:#0B1220; --muted:#556073; --line:#C9D1DC;
  --accent:#F2B300; --accent-ink:#7A5600; --on-accent:#0B1220; --head:#0F1A2B; --on-head:#E9EEF5;
  --ok:#0E7A54; --ok-bg:#DFF2E9; --bad:#B42318; --bad-bg:#FBE6E3;
  --m0:#C9D1DC; --m1:#E39A2D; --m2:#3B7DD8; --m3:#0E8A5C;
  --shadow:0 1px 0 rgba(11,18,32,.04),0 6px 20px -12px rgba(11,18,32,.25);
  --font-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0F17; --surface:#111925; --surface-2:#172131; --ink:#E6ECF3; --muted:#93A0B3; --line:#263346;
  --accent:#F5B800; --accent-ink:#F7C844; --on-accent:#0B1220; --head:#1A2638; --on-head:#E6ECF3;
  --ok:#3CCB95; --ok-bg:#0F2C22; --bad:#FF7466; --bad-bg:#341613;
  --m0:#2A374B; --m1:#E7A23A; --m2:#5B9BF0; --m3:#35C08A;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.7); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A0F17; --surface:#111925; --surface-2:#172131; --ink:#E6ECF3; --muted:#93A0B3; --line:#263346;
  --accent:#F5B800; --accent-ink:#F7C844; --on-accent:#0B1220; --head:#1A2638; --on-head:#E6ECF3;
  --ok:#3CCB95; --ok-bg:#0F2C22; --bad:#FF7466; --bad-bg:#341613;
  --m0:#2A374B; --m1:#E7A23A; --m2:#5B9BF0; --m3:#35C08A;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.7); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:12px 96px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-stretch:118%;letter-spacing:.06em;text-transform:uppercase;font-size:17px;background:none;border:0;padding:0}
.brand svg{flex:none}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:12.5px;font-weight:600;padding:5px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.hot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
@media (max-width:520px){.brand span{display:none}.chip.lvl{display:none}.topbar .in{gap:8px}}
.iconbtn{flex:none;display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
h1,h2,h3{font-family:var(--font-display);font-stretch:112%;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(24px,4vw,32px);font-weight:800}
h2{font-size:19px;font-weight:750;letter-spacing:.01em}
h3{font-size:16px;font-weight:700}
.eyebrow{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;text-decoration:none;color:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.dark{background:var(--head);border-color:var(--head);color:var(--on-head)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.grid-top{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-top:14px}
@media (max-width:820px){.grid-top{grid-template-columns:1fr}}

/* Badge */
.badge{position:relative;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;overflow:hidden}
.badge::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:repeating-linear-gradient(-45deg,var(--accent) 0 10px,var(--head) 10px 20px)}
.avatar{width:72px;height:88px;border-radius:8px;background:var(--head);color:var(--on-head);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-stretch:120%;font-size:26px;letter-spacing:.04em;margin-top:6px;position:relative}
.avatar small{position:absolute;bottom:6px;font-family:var(--font-mono);font-size:9px;letter-spacing:.14em;color:var(--accent)}
.badge .who{min-width:0;margin-top:6px}
.badge .title{font-family:var(--font-mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);font-weight:700}
.xpbar{height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-top:8px}
.xpbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s ease}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat{background:var(--surface-2);border-radius:8px;padding:10px 8px;text-align:center}
.stat b{display:block;font-family:var(--font-mono);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}}

/* Next drill */
.next{display:flex;flex-direction:column;gap:12px;justify-content:space-between}
.next .code{font-family:var(--font-mono);font-weight:700;background:var(--head);color:var(--accent);padding:3px 8px;border-radius:6px;font-size:13px}
.goal{display:flex;gap:6px}
.goal i{flex:1;height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.goal i.on{background:var(--ok);border-color:var(--ok)}
.modes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
@media (max-width:1060px){.modes{grid-template-columns:repeat(3,1fr)}}
@media (max-width:720px){.modes{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.modes{grid-template-columns:1fr}}
.mode.hl{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent),var(--shadow)}
.mode{text-align:left;display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.mode:hover{border-color:var(--accent)}
.mode .k{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.notice{border-left:4px solid var(--accent);background:var(--surface);border-radius:8px;padding:12px 14px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}

/* Matrix */
.matrix-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:26px 0 10px;flex-wrap:wrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.matrix{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;align-items:start}
.col{display:flex;flex-direction:column;gap:6px;min-width:0}
.colhead{background:var(--head);color:var(--on-head);border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.colhead b{font-family:var(--font-display);font-stretch:115%;font-size:13.5px;letter-spacing:.04em;text-transform:uppercase}
.colhead span{font-family:var(--font-mono);font-size:11.5px;color:var(--accent)}
.tile{position:relative;text-align:left;display:flex;flex-direction:column;gap:6px;padding:10px 10px 9px;border-radius:8px;background:var(--surface);border:1px solid var(--line);min-height:84px}
.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.tile .tc{display:flex;justify-content:space-between;align-items:center;gap:6px}
.tile .code{font-family:var(--font-mono);font-weight:700;font-size:12px;color:var(--muted);letter-spacing:.04em}
.tile .nm{font-weight:700;font-size:14.5px;line-height:1.25}
.cvdot{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--accent-ink);border:1px solid currentColor;border-radius:4px;padding:0 4px}
.meter{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:auto}
.meter i{height:6px;border-radius:2px;background:var(--m0)}
.tile .sub{font-family:var(--font-mono);font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
@media (max-width:520px){.matrix{grid-template-columns:1fr}.col .tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}}
.col .tiles{display:flex;flex-direction:column;gap:6px}
@media (min-width:880px){.col.wide{grid-column:span 2}.col.wide .tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}}

/* Quiz */
.quiz{max-width:760px;margin:10px auto 0}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.progress{display:flex;gap:4px;margin-bottom:14px}
.progress i{flex:1;height:6px;border-radius:99px;background:var(--line)}
.progress i.ok{background:var(--ok)}.progress i.bad{background:var(--bad)}.progress i.cur{background:var(--accent)}
.qtext{font-size:clamp(18px,2.6vw,21px);font-weight:700;line-height:1.4;margin:6px 0 16px;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);min-height:56px;font-size:16px;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{display:grid;place-items:center;width:30px;height:30px;border-radius:7px;background:var(--surface-2);font-family:var(--font-mono);font-weight:700;font-size:13px}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.picked{border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt code,.qtext code{font-family:var(--font-mono);font-size:.92em}
.explain{margin-top:14px;padding:14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.explain .verdict{font-weight:800;font-family:var(--font-display);font-stretch:110%;font-size:17px;margin-bottom:4px}
.explain .verdict.ok{color:var(--ok)}.explain .verdict.bad{color:var(--bad)}
.qfoot{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.xpfloat{font-family:var(--font-mono);font-weight:800;color:var(--accent-ink)}
.timer{font-family:var(--font-mono);font-weight:700}
.timer.low{color:var(--bad)}

/* Result */
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{--p:0;width:110px;height:110px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring b{width:84px;height:84px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--font-mono);font-size:24px}
.miss{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.miss .q{font-weight:700}
.ans{display:flex;gap:8px;align-items:baseline;margin-top:4px}
.ans b{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;flex:none}
.ans.ok b{color:var(--ok)}.ans.bad b{color:var(--bad)}

/* STAR */
.starlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.sp{text-align:left;display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);min-height:120px}
.sp:hover{border-color:var(--accent)}
.comp{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);font-weight:700}
.status{font-size:12.5px;color:var(--muted);margin-top:auto}
.status.done{color:var(--ok);font-weight:700}
.starq{font-size:clamp(19px,2.6vw,23px);font-weight:800;font-family:var(--font-display);font-stretch:108%;line-height:1.3}
.field{display:flex;flex-direction:column;gap:6px}
.field{gap:4px}
.field label{display:flex;align-items:center;font-weight:700}
.field .hint{font-size:13.5px;color:var(--muted);margin-bottom:2px}
.letter{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;background:var(--head);color:var(--accent);font-family:var(--font-mono);font-weight:800;margin-right:8px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;resize:vertical;line-height:1.45}
textarea:focus{border-color:var(--accent);outline:none}
.model{display:flex;flex-direction:column;gap:10px}
.model p{margin:0}
.model .fill{background:color-mix(in srgb,var(--accent) 22%,transparent);border-radius:4px;padding:0 3px;font-style:italic}
.checks{display:flex;flex-direction:column;gap:8px}
.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checks input{width:20px;height:20px;accent-color:var(--ok);flex:none;margin-top:2px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:14px 0}
.tab{border:0;background:none;padding:10px 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.ai{white-space:pre-wrap;background:var(--surface-2);border-radius:10px;padding:12px;border:1px solid var(--line);font-size:15px}

/* Settings */
.set{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 12px;font-weight:700;font-family:var(--font-mono);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--head);color:var(--accent)}
.steps{margin:6px 0 0;padding-left:20px}
.steps li{margin:4px 0}
.codebox{font-family:var(--font-mono);background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;user-select:all;word-break:break-all}
input[type=text]{border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;min-height:44px;width:100%}

/* Monthly Challenge + scoreboard */
.newdot{display:inline-block;font-family:var(--font-mono);font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--on-accent);background:var(--accent);border-radius:4px;padding:1px 5px;vertical-align:middle;margin-left:4px}
.challenge{position:relative;overflow:hidden;margin-top:14px;display:grid;grid-template-columns:1.3fr 1fr;gap:18px;background:var(--head);border-color:var(--head);color:var(--on-head);padding-top:22px}
.challenge::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:repeating-linear-gradient(-45deg,var(--accent) 0 10px,transparent 10px 20px)}
.challenge .eyebrow{color:var(--accent)}
.challenge h2{font-size:clamp(20px,3vw,26px)}
.btn.onhead{color:var(--on-head);border-color:color-mix(in srgb,var(--on-head) 35%,transparent)}
.mini{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--on-head) 8%,transparent)}
.mini .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:720px){.challenge{grid-template-columns:1fr}}
.rank{display:inline-grid;place-items:center;min-width:30px;height:24px;border-radius:6px;font-family:var(--font-mono);font-weight:800;font-size:12px;background:var(--surface-2);color:var(--ink)}
.rank.r1{background:var(--accent);color:var(--on-accent)}
.rank.r2{background:#C9D1DC;color:#0B1220}
.rank.r3{background:#D9A066;color:#0B1220}
.progress.dense{gap:2px}.progress.dense i{height:5px}
.bigscore{font-family:var(--font-display);font-stretch:120%;font-size:clamp(44px,9vw,68px);font-weight:800;line-height:.95;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;margin:0 -4px}
table.board{width:100%;border-collapse:collapse;font-size:15px}
table.board th{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.board td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.board .num{text-align:right;white-space:nowrap}
table.board tr.me td{background:color-mix(in srgb,var(--accent) 16%,transparent)}
table.board tr:last-child td{border-bottom:0}
@media (max-width:480px){.hide-sm{display:none}table.board{font-size:14px}}
.tag{font-family:var(--font-mono);font-size:11px;font-weight:800;letter-spacing:.06em;padding:2px 8px;border-radius:99px}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.bad{background:var(--bad-bg);color:var(--bad)}
.post{padding:12px;border-radius:10px;border:1.5px dashed var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--head);color:var(--on-head);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);font-weight:700;z-index:50;max-width:calc(100% - 32px);text-align:center}
.lvlup{border:2px solid var(--accent)}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);font-weight:700;padding:6px 0}
.pill{display:inline-block;font-family:var(--font-mono);font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ===== Learn: library ===== */
.mode.hl2{border-color:var(--m2);box-shadow:inset 0 3px 0 var(--m2),var(--shadow)}
.ltrack{margin-top:22px}

<script>
// Monthly Challenge rules, shared by the app and the Netlify scores function so both
// pick the same 50 questions and compute the same score. Keep it dependency-free.
var CQC = (function () {
  var SIZE = 50, PACK_SLOTS = 10, PER_Q_MS = 20000, FAST_MS = 3000, MIN_MS = 1500;

  function hashInt(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function qid(moduleId, text) { return moduleId + ":" + hashInt(text).toString(36); }

  // Month in Irish time, e.g. "2026-10". The challenge set and the monthly table both key on this.
  function monthKey(date) {
    var p = new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Dublin", year: "numeric", month: "2-digit" }).formatToParts(date || new Date());
    var y = "", m = "";
    p.forEach(function (x) { if (x.type === "year") y = x.value; if (x.type === "month") m = x.value; });
    return y + "-" + m;
  }
  function monthLabel(key) {
    var parts = key.split("-");
    return new Date(Date.UTC(+parts[0], +parts[1] - 1, 15)).toLocaleDateString("en-IE", { month: "long", year: "numeric", timeZone: "UTC" });
  }

  // modules: [{id, ids:[question ids]}] from the core bank (no STAR module).
  // packIds: question ids from this month's pack, if any.
  // Selection depends only on ids and the month, never on array order, so every device agrees.
  function pick(month, modules, packIds) {
    var rank = function (x) { return hashInt(month + "|" + x); };
    var byRank = function (arr) { return arr.slice().sort(function (a, b) { return rank(a) - rank(b) || (a < b ? -1 : 1); }); };
    var mods = modules.filter(function (m) { return m.ids.length; }).slice().sort(function (a, b) { return a.id < b.id ? -1 : 1; });
    var fromPack = byRank(packIds || []).slice(0, PACK_SLOTS);
    var chosen = [], seen = {};
    var add = function (id) { if (id && !seen[id]) { seen[id] = 1; chosen.push(id); } };
    mods.forEach(function (m) { add(byRank(m.ids)[0]); });
    var order = mods.slice().sort(function (a, b) { return rank("m:" + a.id) - rank("m:" + b.id); });
    for (var depth = 1; chosen.length < SIZE - fromPack.length && depth < 20; depth++) {
      for (var i = 0; i < order.length && chosen.length < SIZE - fromPack.length; i++) add(byRank(order[i].ids)[depth]);
    }
    fromPack.forEach(add);
    return chosen.slice(0, SIZE).sort(function (a, b) { return rank("o:" + a) - rank("o:" + b); });
  }

  // 100 for a right answer, up to +50 for speed (full bonus under 3 s, none at 20 s),
  // +10 per answer of running streak (capped at +50). Max 200 a question, 10,000 a run.
  function points(ms, streak) {
    var t = Math.max(ms, MIN_MS);
    var speed = t <= FAST_MS ? 50 : t >= PER_Q_MS ? 0 : Math.round(50 * (PER_Q_MS - t) / (PER_Q_MS - FAST_MS));
    return 100 + speed + 10 * Math.min(Math.max(streak - 1, 0), 5);
  }
  function score(results) {
    var total = 0, streak = 0, correct = 0, ms = 0;
    results.forEach(function (r) {
      var t = Math.min(Math.max(+r.ms || 0, 0), PER_Q_MS); ms += t;
      if (r.ok) { streak++; correct++; total += points(t, streak); } else streak = 0;
    });
    return { score: total, correct: correct, ms: ms };
  }
  return { SIZE: SIZE, PER_Q_MS: PER_Q_MS, MAX: SIZE * 200, hashInt: hashInt, qid: qid, monthKey: monthKey, monthLabel: monthLabel, pick: pick, points: points, score: score };
})();

// Junior-level questions (0-2 years). QX adds questions to an existing module; every QX question is junior.

QX.push({ m: "fund", q: [
  ["What does the 'I' in the CIA triad stand for?", "Integrity", ["Identity", "Isolation", "Inspection"], "The CIA triad is Confidentiality, Integrity and Availability. Integrity means data is accurate and hasn't been changed without permission."],
  ["Which of these is an example of a physical security control?", "A locked server room door", ["An antivirus program", "A password policy", "A firewall rule"], "Physical controls protect buildings and equipment. Antivirus and firewall rules are technical controls; a password policy is an administrative control."],

  ["What is the main goal of a vulnerability scan?", "To find known weaknesses in systems", ["To exploit every weakness it finds", "To stop attacks as they happen", "To encrypt data on the network"], "A vulnerability scanner checks systems against a database of known issues and reports them. A penetration test goes further and tries to exploit them."],
  ["Which statement about strong passwords is TRUE?", "Length matters more than odd symbols", ["Changing them weekly makes them strong", "Short passwords are fine if they use symbols", "Reusing one strong password is safe everywhere"], "Long passphrases resist guessing better than short complex ones. Reuse is dangerous because one breach exposes every account that shares the password."],

QX.push({ m: "cry", q: [
  ["Symmetric encryption uses:", "The same key to encrypt and decrypt", ["A public key and a private key", "No key at all", "A different key for every letter"], "AES is the most common symmetric algorithm. Asymmetric encryption such as RSA uses a public and private key pair."],
  ["Which of these is a symmetric encryption algorithm?", "AES", ["RSA", "SHA-256", "ECDSA"], "AES encrypts with one shared key. RSA and ECDSA are asymmetric, and SHA-256 is a hash function, not encryption."],
  ["What is a digital certificate mainly used for?", "Binding a public key to an identity", ["Storing a user's password safely", "Compressing files before sending", "Blocking malware downloads"], "A certificate, signed by a certificate authority, proves that a public key belongs to a particular website, person or organisation."],
  ["The padlock in a browser address bar means:", "The connection to the site is encrypted", ["The website is safe and trustworthy", "The site has no vulnerabilities", "The site was checked for malware"], "It means TLS is in use. Phishing sites can have valid certificates too, so the padlock alone does not prove a site is legitimate."],
  ["Which is a hashing algorithm?", "SHA-256", ["AES-256", "RSA-2048", "Diffie-Hellman"], "SHA-256 produces a fixed 256-bit digest. AES is encryption, RSA is public-key encryption and signatures, Diffie-Hellman is key exchange."],
  ["Why do we hash files when downloading software?", "To check the file hasn't been altered", ["To make the download faster", "To encrypt the file on disk", "To hide the file from antivirus"], "If the hash you calculate matches the one the vendor publishes, the file is the same as the original."],
  ["Who issues TLS certificates for public websites?", "A certificate authority (CA)", ["The web browser vendor", "The domain's DNS server", "The internet service provider"], "CAs such as Let's Encrypt or DigiCert verify the domain and sign the certificate. Browsers trust a built-in list of CAs."],
  ["What happens when a website's TLS certificate expires?", "Browsers show a security warning", ["The site keeps working with no warning", "The site's data is deleted", "The domain name stops working"], "Expired certificates trigger browser errors and break trust. Automated renewal, for example with ACME, prevents outages."],

]});

QX.push({ m: "lnx", q: [

// Junior-level questions (0-2 years) for Defend & Detect and Respond & Recover.
QX.push({ m: "netsec", q: [
  ["What does a firewall's 'implicit deny' at the end of a rule list do?", "Blocks any traffic not explicitly allowed", ["Allows any traffic not explicitly blocked", "Logs traffic but never blocks any of it", "Blocks only traffic from foreign countries"], "Most firewalls end with an implicit 'deny all'. If no rule above it allows the traffic, it's dropped. That's why you only write allow rules for what the business needs."],
  ["What is a VPN mainly used for?", "An encrypted tunnel over an untrusted network", ["Making internet traffic faster for users", "Scanning email attachments for malware", "Handing out IP addresses to laptops"], "A VPN encrypts traffic between the user (or a site) and the corporate network, so people on the same café Wi-Fi or ISP can't read or alter it."],
  ["Which protocol should replace FTP for moving files securely?", "SFTP", ["TFTP", "Telnet", "SNMPv1"], "FTP sends usernames, passwords and files in clear text. SFTP runs over SSH, so everything is encrypted. TFTP has no authentication at all."],
  ["What is a VLAN used for?", "Splitting one switch into separate logical networks", ["Encrypting traffic between two branch offices", "Giving wireless users a faster connection", "Turning private IPs into public IPs"], "VLANs separate devices into different broadcast domains on the same physical switch, e.g. keeping guest Wi-Fi, printers and finance PCs apart. Traffic between VLANs must pass a router or firewall."],
  ["Which Wi-Fi security standard is the current recommended choice?", "WPA3", ["WEP", "WPA with TKIP", "Open network with MAC filtering"], "WPA3 is the current standard. WEP and WPA-TKIP can be cracked quickly, and MAC filtering is easy to bypass by copying an allowed device's MAC address."],
  ["A firewall rule reads 'source any, destination any, service any, allow'. What is the problem?", "It allows everything, so the firewall does nothing", ["It blocks all traffic and stops the business", "It only allows traffic during office hours", "It forces every connection through the VPN"], "An any-any-allow rule permits all traffic and defeats the purpose of the firewall. Rules should name specific sources, destinations and ports that have a business need."],
  ["Which device would you put in front of a web application to block attacks like SQL injection?", "A web application firewall (WAF)", ["A layer 2 network switch", "A DHCP server", "An NTP time server"], "A WAF inspects HTTP requests and blocks common web attacks such as SQL injection and XSS. It doesn't replace fixing the code, but it adds a layer of protection."],
  ["What is a DDoS attack?", "Many machines flooding a target to knock it offline", ["One attacker guessing many passwords at once", "Malware that encrypts files for a ransom", "Secretly reading traffic between two users"], "A distributed denial-of-service attack uses many machines, often a botnet, to overwhelm a service with traffic so real users can't reach it. It targets availability."],

QX.push({ m: "ids", q: [
  ["An IDS alerts on a normal software update download. This is a:", "False positive", ["True positive", "False negative", "True negative"], "A false positive is an alert on harmless activity. A false negative is a real attack with no alert. Too many false positives cause alert fatigue, so rules get tuned."],

  ["A host-based IDS (HIDS) monitors:", "Logs, files and processes on one machine", ["Traffic across a whole network segment", "Wireless signals around the office", "Firewall rules on the edge router"], "A HIDS runs on a single host and watches things like log entries, file changes and running processes. Tools like Wazuh and OSSEC are common examples."],

  ["Why can a network IDS miss attacks inside HTTPS traffic?", "The payload is encrypted, so it can't read the content", ["HTTPS uses UDP, which IDS sensors ignore", "IDS sensors only inspect email traffic", "HTTPS traffic never crosses the network"], "Without decryption (e.g. TLS inspection at a proxy), a NIDS only sees metadata like IPs, ports and certificate details, not the request itself. Host-based tools help fill this gap."],

  ["What does 'quarantine' do in antivirus or EDR?", "Moves a suspicious file somewhere it can't run", ["Deletes every file in the same folder", "Uploads the file to a public website", "Disconnects the whole office network"], "Quarantine isolates the file in a protected area so it can't execute, while keeping a copy for analysis or restoring if it turns out to be a false positive."],

QX.push({ m: "cti", q: [
  ["Which of these is an example of an indicator of compromise (IOC)?", "A known malicious file hash", ["A company's patching policy", "An employee's job title", "A firewall vendor's name"], "IOCs are technical artefacts linked to malicious activity: file hashes, bad IPs and domains, URLs, registry keys. They help you search your logs for signs of a known attack."],
  ["What does APT stand for in threat intelligence?", "Advanced Persistent Threat", ["Automated Phishing Tool", "Applied Protection Technique", "Active Port Tracking"], "An APT is a skilled, well-resourced group (often state-linked) that targets specific organisations and stays hidden for a long time, usually for espionage."],
  ["Which threat actor type is MOST often driven by money?", "Cybercriminal groups", ["Hacktivists", "Nation-state espionage teams", "Disgruntled ex-employees"], "Cybercriminals (e.g. ransomware gangs) want money. Hacktivists act for a cause, nation-states mostly want intelligence, and insiders may act from revenge or grievance."],
  ["What does OSINT mean?", "Intelligence gathered from public sources", ["Intelligence bought on dark web markets", "Data taken only from internal SIEM logs", "Information vendors share under NDA"], "Open-source intelligence uses publicly available information: websites, social media, DNS records, breach reports and news. Attackers use it for recon too."],
  ["VirusTotal is commonly used to:", "Check a file hash, URL or IP against many engines", ["Run a penetration test against a website", "Store a company's backups securely", "Manage firewall rules from one console"], "VirusTotal checks samples, hashes, URLs and IPs against dozens of AV engines and reputation sources. Be careful: uploaded files can be seen by others, so search the hash first."],
  ["In MITRE ATT&CK, the 'Initial Access' tactic covers:", "How attackers first get into a network", ["How attackers steal data at the end", "How attackers hide from antivirus", "How attackers keep access after reboots"], "Initial Access includes techniques like phishing, exploiting public-facing apps and using valid accounts. Hiding is Defense Evasion, staying in is Persistence, and stealing data is Exfiltration."],
  ["In the Pyramid of Pain, which indicator is EASIEST for an attacker to change?", "File hash values", ["Tactics, techniques and procedures", "Attack tools", "Host and network artefacts"], "Changing one byte gives a new hash, so blocking hashes causes attackers little pain. Detecting their behaviour (TTPs) at the top of the pyramid is much harder for them to dodge."],

QX.push({ m: "ir", q: [
  ["Which of these is a security incident rather than just an event?", "Malware encrypting files on a file server", ["A user logging in successfully at 9 a.m.", "A scheduled backup finishing on time", "A firewall allowing normal web traffic"], "Events are any observable occurrence. An incident is an event that harms or threatens confidentiality, integrity or availability, such as ransomware encrypting data."],
  ["A junior analyst confirms a real incident. Who should they tell first?", "The incident lead, following the escalation path", ["Customers, by email, straight away", "The whole company on the team chat", "Nobody until it has been fully fixed"], "The IR plan's escalation path makes sure the right people take charge quickly. External and company-wide communication is decided by the incident lead, legal and comms."],
  ["In incident response, eradication means:", "Removing the cause, such as malware and attacker access", ["Disconnecting the affected host from the network", "Restoring systems from backup", "Writing the final incident report"], "Eradication removes what caused the incident: malware, backdoors, compromised accounts and the exploited weakness. Disconnecting a host is containment; restoring is recovery."],
  ["What is a CSIRT?", "A team that handles security incidents", ["A type of encryption standard", "A compliance certificate for clouds", "A firewall configuration template"], "A Computer Security Incident Response Team coordinates detection, response and recovery. Many countries also run a national CSIRT, such as Ireland's NCSC CSIRT-IE."],
  ["Why keep a written timeline during an incident?", "It shows what happened when, for analysis and reports", ["It replaces the need to collect any evidence", "It warns the attacker that they were spotted", "It is only needed if the police get involved"], "A timeline of actions and findings helps the team stay coordinated, supports root cause analysis and is needed for regulator reports and the lessons-learned review."],

QX.push({ m: "dfir", q: [
  ["What is a forensic image?", "A bit-for-bit copy of a storage device", ["A screenshot of the suspect's desktop", "A compressed backup of user documents", "A photo of the device for the report"], "A forensic image copies every sector, including deleted files and unallocated space. Analysts work on the image and verify it against the original with a hash."],
  ["Why do analysts examine a copy rather than the original evidence?", "So the original stays unchanged and admissible", ["Copies always load faster in forensic tools", "The original is usually encrypted by default", "Law requires originals to be destroyed"], "Working on the original risks changing it, which could make it unusable in court. A verified copy can be examined freely while the original is stored safely."],
  ["In file forensics, 'MAC times' are:", "Modified, accessed and changed/created timestamps", ["Times recorded against a device's MAC address", "Memory allocation counters in RAM", "Mail arrival and collection times"], "MAC(B) timestamps record when a file was modified, accessed, changed (metadata) or born (created). They help build a timeline of what a user or attacker did."],
  ["On Ubuntu or Debian, which file usually records SSH login attempts?", "/var/log/auth.log", ["/etc/shadow", "/var/log/dpkg.log", "/home/user/.bashrc"], "auth.log records authentication events, including SSH logins and sudo use. On Red Hat-based systems the same data goes to /var/log/secure."],
  ["Which tool is commonly used to create a forensic disk image?", "FTK Imager", ["Nmap", "Burp Suite", "Metasploit"], "FTK Imager (and dd/dcfldd on Linux) create forensic images and calculate hashes. Nmap is a port scanner, Burp tests web apps and Metasploit is an exploitation framework."],
  ["Which command-line tool captures network packets on Linux?", "tcpdump", ["netstat", "traceroute", "nslookup"], "tcpdump captures packets to the screen or a .pcap file for later analysis in Wireshark. netstat lists connections, traceroute shows the path and nslookup queries DNS."],
]});

QX.push({ m: "bcp", q: [

// Junior-level questions (0-2 years) for Offense & AppSec and Cloud & Automation.
QX.push({ m: "vapt", q: [
  ["What is reconnaissance in a penetration test?", "Gathering information about the target first", ["Writing the final report for the client", "Fixing the weaknesses after the test", "Removing tools left on the target"], "Recon comes first: finding domains, IP ranges, staff names, technologies and exposed services. Good recon shapes the rest of the test."],
  ["John the Ripper and Hashcat are used for:", "Cracking password hashes", ["Scanning networks for open ports", "Intercepting web requests", "Capturing wireless packets"], "Both tools try candidate passwords against captured hashes. Weak or reused passwords fall quickly, which is why length and MFA matter."],
  ["What does the 'scope' of a penetration test define?", "The systems and methods the tester is allowed to use", ["The price the client pays for the work", "The list of findings in the final report", "The tester's certification level"], "Scope lists in-scope targets, excluded systems, testing windows and allowed techniques. Going outside it can be illegal even with good intentions."],
  ["Which Linux distribution is built for penetration testing?", "Kali Linux", ["Ubuntu Server", "Red Hat Enterprise Linux", "Alpine Linux"], "Kali Linux comes with hundreds of security tools such as Nmap, Burp Suite, Metasploit and Hashcat pre-installed. Parrot OS is a similar alternative."],
  ["In a black box test, the tester:", "Starts with little or no inside knowledge", ["Gets full source code and network diagrams", "Only tests the internal network", "Only tests physical building security"], "Black box simulates an outside attacker with no inside information. Grey box gives some details (like a user login) and white box gives full knowledge."],
  ["Which tool is mainly used to find open ports and services?", "Nmap", ["Wireshark", "Hashcat", "KeePass"], "Nmap discovers hosts, open ports, services and versions. Wireshark captures and analyses packets, Hashcat cracks hashes and KeePass is a password manager."],

QX.push({ m: "web", q: [
  ["What does HTTPS add over plain HTTP?", "Encryption and server authentication using TLS", ["Faster page loads for every visitor", "Automatic blocking of SQL injection", "Compression of images and scripts"], "HTTPS wraps HTTP in TLS, so traffic is encrypted and the browser can check the server's certificate. It does not fix bugs in the app itself."],
  ["Which HTTP status code means 'Forbidden'?", "403", ["404", "500", "302"], "403 means the server understood the request but refuses access. 404 is Not Found, 500 is a server error and 302 is a redirect. 401 means authentication is needed."],
  ["A login page says 'wrong password' for real usernames and 'user not found' for others. What is the risk?", "Attackers can find out which usernames exist", ["Passwords are stored in plain text", "The page is open to stored XSS", "Sessions never expire on the site"], "Different messages allow username enumeration, which makes password spraying easier. Use one generic message such as 'Invalid username or password'."],
  ["Which HTTP method should a login form use to send credentials?", "POST", ["GET", "HEAD", "OPTIONS"], "POST sends the data in the request body. GET puts it in the URL, which ends up in browser history, proxy logs and server logs."],
  ["Setting the 'Secure' flag on a session cookie means it:", "Is only sent over HTTPS", ["Can't be read by JavaScript", "Is deleted when the browser closes", "Is only sent to the same site"], "Secure stops the cookie travelling over plain HTTP. HttpOnly blocks JavaScript access, SameSite limits cross-site sending, and no expiry makes it a session cookie."],
  ["What is input validation?", "Checking user input is the expected type and format", ["Encrypting user input before saving it", "Asking users to confirm their password", "Logging every request the user sends"], "Validation rejects input that doesn't fit what's expected (e.g. a date, an email, a number in range). It reduces risk but must be combined with output encoding and parameterised queries."],
]});

QX.push({ m: "devsecops", q: [
  ["Why should passwords and API keys never be hard-coded in source code?", "Anyone with the code, or a leak of it, can read them", ["Compilers can't handle long text strings", "It makes the application run slower", "Git refuses to store files containing them"], "Code is copied, shared and sometimes leaked. Keep secrets in a secrets manager or environment variables injected at runtime, never in the repository."],
  ["A developer pushes an AWS access key to a public GitHub repo. What should happen FIRST?", "Revoke and rotate the key", ["Delete the commit and carry on", "Make the repo private and move on", "Remind the team to be more careful"], "Bots scan GitHub for keys within minutes, so assume it's compromised. Revoke it, issue a new one, check CloudTrail for misuse, then clean the history."],
  ["What is a CI/CD pipeline?", "Automated steps that build, test and deploy code", ["A cable linking the build servers together", "A manual checklist signed off by the CISO", "A firewall that protects developers' laptops"], "Continuous integration and delivery automate building, testing and releasing. Security checks such as SAST, SCA and secret scanning can run in the same pipeline."],
  ["What is a pull request (PR) review used for?", "Having others check code changes before merging", ["Deploying code straight to production", "Running the app on a developer laptop", "Storing secrets for the build pipeline"], "Reviews catch bugs and security issues such as hard-coded secrets or missing input checks. Branch protection can require an approved review and passing checks before merge."],
  ["Which file stops Git from committing files such as .env?", ".gitignore", [".gitconfig", ".gitattributes", "README.md"], ".gitignore lists files Git should not track. If a secret was already committed, ignoring the file isn't enough: rotate the secret and clean the history."],
  ["Container image scanners such as Trivy look for:", "Known vulnerabilities in the image's packages", ["Containers that are running slowly", "Unused CPU capacity in the cluster", "Spelling mistakes in the Dockerfile"], "Trivy and similar tools list the OS packages and libraries in an image and match them against CVE databases. They can also flag misconfigurations and secrets."],
  ["What is threat modelling?", "Working out what could go wrong in a design early", ["Testing a live app with automated attacks", "Writing the incident response playbooks", "Ranking staff by phishing test results"], "Threat modelling (e.g. with STRIDE) looks at a system's design, data flows and trust boundaries to find threats before code is written, when fixes are cheapest."],

QX.push({ m: "vuln", q: [
  ["What does CVE stand for?", "Common Vulnerabilities and Exposures", ["Critical Vulnerability Evaluation", "Cyber Vulnerability Exchange", "Common Virus Entries"], "A CVE ID (e.g. CVE-2021-44228) is a unique name for a publicly known vulnerability, so everyone can refer to the same issue."],
  ["A vulnerability with a CVSS v3.1 score of 9.8 is rated:", "Critical", ["High", "Medium", "Severe"], "CVSS v3.1 bands: 0.1-3.9 Low, 4.0-6.9 Medium, 7.0-8.9 High, 9.0-10.0 Critical. 'Severe' is not a CVSS rating."],
  ["What is 'Patch Tuesday'?", "Microsoft's monthly release of security updates", ["A yearly audit of how well patching is done", "A day each week when patching is banned", "Apple's weekly release of beta updates"], "Microsoft releases most security updates on the second Tuesday of each month. Many teams plan their patch testing and rollout around it."],
  ["Why test patches on a small group before rolling them out everywhere?", "An update can break apps, so problems show early", ["Patches only work after a second install", "Vendors require a test group for support", "Testing makes the patch download faster"], "A pilot group (or test environment) catches compatibility problems before they hit every machine. Urgent patches for exploited flaws may get a shorter test window."],

QX.push({ m: "cloud", q: [
  ["With a SaaS service such as Microsoft 365, what is the customer still responsible for?", "Their data, user accounts and access settings", ["Patching the servers that run the service", "Physical security of the data centres", "Maintaining the hypervisor layer"], "In SaaS the provider runs almost everything, but you always own your data, identities, MFA, sharing settings and who has access."],
  ["What is an AWS region?", "A geographic area with several data centres", ["A single rack of servers in one building", "A billing account for one team", "A virtual network inside one account"], "A region (e.g. eu-west-1 in Ireland) contains multiple Availability Zones, which are separate data centres. Spreading across AZs improves availability."],
  ["What causes most cloud data exposures?", "Misconfiguration, such as public storage", ["Cloud providers' hardware failing", "Quantum computers breaking encryption", "Physical break-ins at data centres"], "Most cloud incidents come from customer mistakes: public buckets, open security groups, leaked keys and too many permissions, not from the provider being hacked."],
  ["Which cloud model gives the customer the MOST control over the operating system?", "IaaS", ["PaaS", "SaaS", "FaaS"], "With IaaS you manage the OS, middleware and apps on virtual machines. PaaS and FaaS hide the OS, and SaaS gives you just the application."],
  ["Why avoid long-lived access keys for AWS users?", "A leaked key keeps working until it's revoked", ["They make every API call noticeably slower", "AWS charges extra for each key created", "They expire after an hour and break scripts"], "Long-lived keys are a common breach cause. Prefer IAM roles and temporary credentials (e.g. via SSO), which expire automatically."],
  ["What is an Amazon S3 bucket?", "A container for storing objects such as files", ["A firewall attached to EC2 instances", "A log of API calls made in the account", "A type of virtual machine instance"], "S3 stores objects in buckets. Bucket policies, Block Public Access and encryption settings decide who can read them, so they are a common audit point."],
]});

QX.push({ m: "cac", q: [
  ["What is Infrastructure as Code (IaC)?", "Defining infrastructure in files that a tool applies", ["Writing the apps that run on the servers", "Drawing network diagrams by hand", "Encrypting server configuration files"], "IaC tools such as Terraform, CloudFormation and Bicep create infrastructure from code. That makes builds repeatable, reviewable and scannable."],
  ["Terraform configuration is usually written in:", "HashiCorp Configuration Language", ["PowerShell script files", "XML documents with a schema", "Python notebook (.ipynb) cells"], "Terraform uses HCL (HashiCorp Configuration Language) in .tf files (JSON is also accepted). Providers translate it into API calls to AWS, Azure, GCP and others."],
  ["What does 'terraform apply' do?", "Makes the planned changes to real infrastructure", ["Shows changes without making any of them", "Downloads the provider plugins needed", "Formats the .tf files to a standard style"], "init downloads providers, fmt formats code, plan previews changes and apply carries them out. Reviewing the plan before apply is a key control."],
  ["Why keep infrastructure code in version control such as Git?", "Every change is tracked, reviewed and can be reverted", ["Git encrypts all infrastructure secrets", "Cloud providers require a GitHub account", "It removes any need for testing changes"], "Git gives history, pull-request review and rollback. That history is also audit evidence of who changed what, when and with whose approval."],
  ["Ansible is mainly used for:", "Automating server configuration over SSH", ["Scanning containers for vulnerabilities", "Capturing packets on the network", "Monitoring logs in real time"], "Ansible runs playbooks (YAML) against servers, usually over SSH with no agent. It is often used to apply hardening settings consistently."],
  ["What is a CIS Benchmark?", "A consensus hardening guide for a system or service", ["A cloud provider's calculator for monthly pricing", "A speed test that rates servers and networks", "A certification exam for security analysts"], "CIS Benchmarks give step-by-step secure settings for operating systems, cloud accounts, databases and more. Scanners can check systems against them automatically."],
  ["What does 'hardening' a server mean?", "Removing unneeded features and locking down settings", ["Adding more CPU and memory for heavy loads", "Putting it in a locked rack in the server room", "Backing it up more often to the cloud"], "Hardening reduces the attack surface: disable unused services and accounts, change defaults, apply patches and secure configuration, often following a CIS Benchmark."],
]});

QX.push({ m: "iam", q: [
  ["What is the difference between authentication and authorisation?", "Authentication proves identity; authorisation sets access", ["Authorisation proves identity; authentication sets access", "They mean the same thing in practice", "Authentication applies only to admins"], "First you prove who you are (authentication), then the system decides what you may do (authorisation). MFA strengthens the first; least privilege governs the second."],
  ["Which is an example of 'something you are'?", "A fingerprint", ["A PIN", "A smart card", "A code sent by SMS"], "Biometrics such as fingerprints or face scans are 'something you are'. A PIN is something you know, and a smart card or SMS code is something you have."],
  ["What is single sign-on (SSO)?", "One login that gives access to many apps", ["One shared password for the whole team", "A login that never asks for MFA again", "A separate account for each application"], "With SSO the user signs in once to an identity provider (e.g. Entra ID or Okta) and gets into connected apps without separate passwords. It also makes offboarding faster."],
  ["When an employee leaves, their accounts should be:", "Disabled promptly in the leaver process", ["Kept active for a year in case they return", "Given to their manager to keep using", "Left alone until the next annual review"], "Leaver accounts that stay active are a common audit finding and attack route. HR and IT should trigger disabling on or before the last day."],
]});

QX.push({ m: "zt", q: [
  ["'Never trust, always verify' is the motto of:", "Zero trust", ["Defence in depth", "Security through obscurity", "Perimeter security"], "Zero trust checks every access request based on identity, device and context, instead of trusting anything just because it's inside the network."],
  ["In a zero trust model, being on the office network means:", "No extra trust: each request is still checked", ["Full access to every internal app", "MFA is no longer needed for the user", "Device health checks are skipped"], "Network location alone grants nothing. A request from the office Wi-Fi is verified the same way as one from home."],
  ["What does 'assume breach' mean?", "Design as if an attacker is already inside", ["Accept breaches as an unavoidable cost", "Pay any ransom quickly to limit damage", "Stop monitoring the internal network"], "Assuming breach leads to segmentation, least privilege, strong logging and fast detection, so an intruder can't move freely or go unnoticed."],
  ["Which is a common zero trust building block?", "Strong MFA for every user", ["One shared admin password", "A flat internal network", "Trusting all VPN users fully"], "Zero trust relies on strong identity (MFA), device checks, least privilege and segmentation. Shared passwords and flat networks are the opposite."],
  ["Why shouldn't staff paste customer data into a public AI chatbot?", "The data may be kept or used outside company control", ["Chatbots can't read text containing names", "It makes the chatbot's answers less accurate", "Customer data is too large for chatbots to read"], "Public AI tools may store prompts or use them for training, and the company loses control of personal data. Use approved tools and follow the AI use policy."],
  ["A deepfake is:", "AI-made fake video, audio or images of real people", ["A phishing email sent from a spoofed address", "A forged TLS certificate used on a fake site", "Malware that hides itself deep in the kernel"], "Deepfakes have been used to impersonate executives on calls to approve payments. A call-back on a known number is a simple control against this."],
  ["Why is continuous verification important in zero trust?", "Risk can change after login, e.g. a stolen session token", ["Users forget their passwords during the day", "It makes applications load more quickly", "Logins only need checking once a month"], "Zero trust re-checks signals such as device health, location and behaviour during a session, so a hijacked or risky session can be blocked or challenged."],

// Junior-level questions (0-2 years) for GRC: ISO 27001, NIST, SOC 2, GDPR, risk and compliance, specialist.
QX.push({ m: "iso", q: [
  ["What is ISO/IEC 27001?", "A standard for an information security management system", ["A law that applies to every company in the EU", "A list of approved antivirus products", "A US framework written for federal agencies"], "ISO/IEC 27001 sets requirements for an ISMS: how an organisation manages information security risks through policies, processes and controls. Organisations can be certified against it."],
  ["What does ISMS stand for?", "Information Security Management System", ["Integrated Security Monitoring Service", "Internal Systems Management Standard", "Information Systems Modernisation Scheme"], "An ISMS is the set of policies, processes, roles and controls an organisation uses to manage information security risk in a systematic way."],
  ["Which ISO 27001 document lists the Annex A controls that apply, and why?", "Statement of Applicability", ["Information security policy", "Business continuity plan", "Asset register"], "The SoA lists every Annex A control, whether it's included or excluded, the reason, and whether it's implemented. Auditors use it as a map of the ISMS."],
  ["ISO 27001's clauses 4-10 are commonly mapped to which improvement cycle?", "Plan-Do-Check-Act", ["Detect-Respond-Recover", "Identify-Protect-Detect", "Define-Measure-Analyse"], "Clauses 4-7 plan, 8 does, 9 checks and 10 acts. The current edition no longer names PDCA, but its structure still follows the cycle."],
  ["Which standard gives detailed guidance on implementing the Annex A controls?", "ISO/IEC 27002", ["ISO/IEC 27005", "ISO 9001", "ISO 22301"], "ISO/IEC 27002 explains each control's purpose and how to implement it. ISO/IEC 27005 covers information security risk management and ISO 22301 covers business continuity."],
  ["Which of these can an organisation be certified against?", "ISO/IEC 27001", ["ISO/IEC 27002", "ISO/IEC 27005", "ISO 31000"], "Only ISO/IEC 27001 contains auditable 'shall' requirements for certification. 27002, 27005 and 31000 are guidance documents."],
  ["Screening staff and running security awareness training belong to which Annex A theme?", "People controls", ["Organisational controls", "Physical controls", "Technological controls"], "The People theme (A.6) has 8 controls, including screening, terms of employment, awareness training, disciplinary process, remote working and reporting security events."],
  ["Clear desk and clear screen falls under which Annex A theme?", "Physical controls", ["People controls", "Technological controls", "Organisational controls"], "Clear desk and clear screen is A.7.7 in the Physical theme, alongside controls like physical entry, secure areas and equipment protection."],
  ["What is the main purpose of the information security policy in an ISMS?", "To set management's direction and commitment", ["To list every firewall rule in the company", "To record each security incident in detail", "To show the full network diagram"], "The policy is a short, approved statement of intent: objectives, commitment to meet requirements and to improve. Detailed rules live in topic policies, standards and procedures."],
  ["Under Clause 5.1, who must show leadership and commitment to the ISMS?", "Top management", ["The IT help desk", "The external auditors", "Each employee on their own"], "Top management must make sure the ISMS has resources, fits the business strategy, is communicated and achieves its outcomes. Auditors look for real evidence of this, not just a signature."],
  ["What is the main purpose of an ISO 27001 internal audit (Clause 9.2)?", "To check the ISMS meets requirements and works", ["To issue the ISO 27001 certificate", "To test staff with phishing emails", "To replace the management review"], "Internal audits check that the ISMS conforms to the standard and the organisation's own rules and is effectively run. Only an accredited certification body issues certificates."],
  ["In ISO 27001 risk treatment, applying controls to lower a risk is called:", "Modifying (reducing) the risk", ["Retaining the risk", "Avoiding the risk", "Sharing the risk"], "The treatment options are modify (add controls), retain (accept), avoid (stop the activity) and share (e.g. insurance or outsourcing). Most risks are treated by modifying them."],
  ["ISO 27001 information security objectives (Clause 6.2) should be:", "Measurable where practicable and monitored", ["Kept secret from staff and suppliers", "Set once at certification and left alone", "Written by the certification body"], "Objectives must fit the policy, be measurable if practicable, be monitored, communicated and updated, and be kept as documented information, with plans for achieving them."],
  ["What happens in an ISO 27001 surveillance audit?", "The certification body checks the ISMS is still maintained", ["The company audits its own suppliers' controls", "Every control is re-certified from scratch", "The police review the company's security"], "Surveillance audits happen in years 2 and 3 of the certificate cycle. They sample parts of the ISMS to confirm it is still running, before a full recertification audit in year 3."],
  ["A company's ISO 27001 certificate covers only its Dublin data centre. What about its London office?", "It isn't covered by the certificate", ["It is covered automatically as well", "It is covered for two years only", "It is covered if it uses the same IT"], "A certificate only covers what's in the ISMS scope. Always read the scope statement on a certificate before relying on it, especially for a supplier."],
  ["What does 'continual improvement' mean in ISO 27001?", "Regularly making the ISMS more suitable and effective", ["Buying new security tools every single year", "Rewriting every policy each month", "Adding controls until risk reaches zero"], "Clause 10.1 requires ongoing improvement, fed by audits, incidents, metrics and management reviews. Risk can never be zero; the aim is to keep it within appetite."],
]});

QX.push({ m: "audit", q: [
  ["What is audit evidence?", "Records, statements or facts the auditor can verify", ["The auditor's personal opinion of the team", "The final report given to management", "The certificate issued after the audit"], "Evidence is verifiable information such as records, logs, screenshots, observations and interview answers, which the auditor compares against the audit criteria."],
  ["A first-party audit is:", "An internal audit an organisation does on itself", ["A customer auditing one of its suppliers", "An audit performed by a certification body", "An inspection performed by a regulator"], "First party is internal, second party is a customer auditing a supplier, and third party is an independent body such as a certification body."],
  ["In auditing, what is a nonconformity?", "Not meeting a requirement", ["A suggestion to improve a process", "A risk that has been formally accepted", "A control that is working well"], "A nonconformity is a failure to meet a requirement, whether from the standard, a law or the organisation's own policy. It's graded as major or minor."],
  ["In an audit, 'sampling' means:", "Testing a selection of items instead of all of them", ["Taking copies of every file in the company", "Asking staff to rate the audit afterwards", "Running a scan on all servers at once"], "Auditors usually can't check every record, so they test a sample (e.g. 25 of 400 new joiners) and draw a conclusion about the whole population."],
  ["Why are audit logs useful to an auditor?", "They show who did what and when", ["They make the system run more quickly", "They replace the need for policies", "They stop users making mistakes"], "Logs give objective evidence of activity, for example who approved a change or who accessed a system. They must be protected so they can't be altered."],
  ["What is the main purpose of an audit's opening meeting?", "To confirm scope, plan and logistics with the auditee", ["To present the final findings and grades", "To sign the certificate of compliance early", "To interview every employee at the same time"], "The opening meeting confirms the scope, objectives, schedule, contacts and how findings will be reported, so the audit runs smoothly."],
  ["What is the BEST evidence that staff were told about a new policy?", "Signed acknowledgements or training records", ["The policy file saved on the intranet", "A manager saying 'everyone knows it'", "The date the policy was approved"], "Publishing a policy doesn't prove anyone read it. Acknowledgements or training completion records show that each person was actually informed."],
]});

QX.push({ m: "itgc", q: [
  ["What does ITGC stand for?", "IT General Controls", ["IT Governance Committee", "Internal Technology Grading Criteria", "Integrated Threat and Gap Check"], "ITGCs are the baseline controls over IT systems (access, change, operations and development) that support reliable applications and data."],
  ["Which of these is an example of an ITGC?", "Approving user access before it is granted", ["Checking an invoice total against the PO", "Counting the cash in the till each night", "Reviewing next year's sales forecast"], "Access approval is a general IT control. Matching invoices to purchase orders is a business process control, even if a system helps with it."],
  ["Why do financial auditors care about ITGCs?", "They support reliable automated controls and reports", ["They decide the company's corporate tax rate", "They remove the need for any financial audit", "They set staff salaries and yearly bonuses"], "If ITGCs fail, auditors can't rely on automated controls or system reports, because someone could have changed the logic or data without approval."],
  ["Why shouldn't developers push their own code straight to production?", "It breaks segregation of duties and skips approval", ["Production servers can't run code from laptops", "It makes the code compile much more slowly", "Developers aren't allowed to write any tests"], "Separating development from deployment, with approval in between, stops unauthorised or untested changes reaching live systems."],
  ["A user access review is when:", "Managers confirm their staff's access is still needed", ["Users rate how easy the system is to use", "IT counts how many licences are used", "HR checks staff completed their training"], "Managers or system owners review who has access and remove what isn't needed. Evidence of the review and the removals is what auditors test."],
  ["What is a 'control owner'?", "The person responsible for running a control", ["The auditor who tests the control", "The vendor that sells the control tool", "A board member who approves budgets"], "Each control needs a named owner who performs it (or makes sure it runs) and keeps the evidence. Unowned controls tend to stop happening."],
  ["Which of these is an automated control?", "A system blocks payments over the approval limit", ["A manager signs off a monthly report", "A clerk checks invoices against POs", "IT reviews admin access each quarter"], "Automated controls are performed by the system every time without human action. The other three are manual controls."],
]});

QX.push({ m: "nist", q: [
  ["What are the six functions of NIST CSF 2.0?", "Govern, Identify, Protect, Detect, Respond, Recover", ["Plan, Identify, Protect, Detect, Respond, Recover", "Govern, Assess, Protect, Monitor, Respond, Restore", "Identify, Protect, Detect, Contain, Eradicate, Recover"], "CSF 2.0 (February 2024) added Govern to the original five functions. Govern sits at the centre and informs how the others are carried out."],
  ["Which organisation publishes the Cybersecurity Framework (CSF)?", "NIST", ["ISO", "ENISA", "ISACA"], "The US National Institute of Standards and Technology publishes the CSF and the SP 800 series. ENISA is the EU's cybersecurity agency and ISACA publishes COBIT."],
  ["What does NIST stand for?", "National Institute of Standards and Technology", ["National Information Security Taskforce", "Network Intrusion Standards Team", "National Institute for Security Testing"], "NIST is a US government agency under the Department of Commerce. Its guidance is free and widely used outside the US too."],
  ["Encrypting data on laptops maps to which CSF function?", "Protect", ["Identify", "Detect", "Recover"], "Protect covers safeguards such as access control, awareness training, data security (including encryption) and platform security."],
  ["Reviewing logs for unusual activity maps to which CSF function?", "Detect", ["Protect", "Respond", "Govern"], "Detect covers continuous monitoring and analysing adverse events, for example SIEM alerting and log review."],
  ["Isolating an infected server during an attack maps to which CSF function?", "Respond", ["Recover", "Detect", "Protect"], "Respond covers incident management, analysis, mitigation (containment) and reporting. Recover then restores normal operations."],
  ["Running a phishing awareness programme maps to which CSF function?", "Protect", ["Identify", "Detect", "Govern"], "Awareness and training (PR.AT) is in Protect. Govern sets the roles, policy and strategy, but the training itself is a protective safeguard."],
  ["Setting the organisation's cyber risk appetite falls under which CSF 2.0 function?", "Govern", ["Identify", "Protect", "Respond"], "Govern includes risk management strategy (GV.RM), such as risk appetite and tolerance, as well as roles, policy and supply chain risk."],
  ["In CSF 2.0, identifying vulnerabilities in assets sits under which function?", "Identify", ["Detect", "Protect", "Respond"], "Vulnerability identification is part of Risk Assessment (ID.RA-01). Detect is about spotting adverse events and attacks as they happen."],
  ["What does the Govern function in CSF 2.0 cover?", "Strategy, roles, policy and oversight of cyber risk", ["Backups and restoring systems after attacks", "Firewall and antivirus configuration", "Log monitoring and alert triage"], "Govern covers organisational context, risk strategy, roles and responsibilities, policy, oversight and supply chain risk management."],
  ["In the CSF 2.0 Core, what comes below each Function?", "Categories, then Subcategories", ["Domains, then Controls", "Pillars, then Practices", "Themes, then Clauses"], "Each Function has Categories (e.g. PR.AA Identity Management, Authentication and Access Control) which break into Subcategories, the specific outcomes."],
  ["CSF Tiers describe:", "How rigorous an organisation's cyber risk practices are", ["The price levels for getting NIST certified", "How many people work in the security team", "How business-critical each IT asset is"], "The four Tiers (Partial, Risk Informed, Repeatable, Adaptive) describe the rigour of cyber risk governance and management. They're not maturity scores to certify."],
  ["What does the NIST CSF mainly help an organisation do?", "Understand, prioritise and communicate cyber risk", ["Get an official certificate for customers", "Replace the need for security policies", "Block cyber attacks automatically"], "The CSF gives a common language of outcomes for managing cyber risk. There's no CSF certificate; it's a voluntary framework."],
  ["NIST CSF outcomes are written to be:", "Technology-neutral: what to achieve, not how", ["Exact product settings to configure", "Laws with fines for non-compliance", "Only for US federal agencies to use"], "The CSF describes outcomes so any organisation can meet them with its own tools. Informative references point to detailed controls like SP 800-53 or ISO 27001."],
  ["Why do many companies outside the US use the NIST CSF?", "It's free, flexible and widely recognised", ["It's required by EU law for all companies", "It provides an official certificate", "It replaces ISO 27001 certification"], "The CSF is free and maps to other frameworks, so it's a popular way to assess and report posture, often alongside ISO 27001."],
  ["NIST SP 800-61 is a guide to:", "Incident response", ["Password and identity rules", "Wiping old storage media", "Risk assessment methods"], "SP 800-61 is NIST's incident response guide. Rev. 3 (2025) aligns it with CSF 2.0. Identity is SP 800-63, media sanitisation 800-88 and risk assessment 800-30."],
  ["Which NIST publication gives guidance on passwords and digital identity?", "SP 800-63", ["SP 800-53", "SP 800-61", "SP 800-88"], "SP 800-63 (Digital Identity Guidelines) covers identity proofing, authentication and federation, including modern password advice such as checking against breached lists."],
  ["NIST SP 800-115 is a guide to:", "Technical security testing and assessment", ["Digital identity and passwords", "Sanitising storage media", "Handling security incidents"], "SP 800-115 covers planning and running security tests such as vulnerability scanning and penetration testing, and reporting the results."],
  ["Making and testing backups maps to which CSF 2.0 function?", "Protect", ["Recover", "Respond", "Identify"], "Backups are PR.DS-11 under Protect (Data Security). Recover is where you use them to restore after an incident, but creating and testing them is a protective safeguard."],
]});

QX.push({ m: "soc2", q: [
  ["Who created the SOC 2 framework?", "The AICPA", ["ISO", "NIST", "The PCI SSC"], "SOC 2 comes from the American Institute of Certified Public Accountants. That's why only licensed CPA firms can issue SOC 2 reports."],
  ["SOC 2 reports are assessed against:", "The Trust Services Criteria", ["ISO 27001 Annex A controls", "NIST CSF subcategories", "PCI DSS requirements"], "The AICPA's Trust Services Criteria define what is assessed. Each organisation designs its own controls to meet the criteria in scope."],
  ["What are the five Trust Services Criteria categories?", "Security, Availability, Processing Integrity, Confidentiality, Privacy", ["Security, Availability, Integrity, Compliance, Privacy", "Security, Resilience, Accuracy, Confidentiality, Privacy", "Security, Availability, Processing Integrity, Continuity, Privacy"], "Security is always included. The other four are added when relevant to the service and the commitments made to customers."],
  ["A SOC 2 Type I report:", "Assesses control design at a single point in time", ["Tests controls over a 6-12 month period", "Is a public seal shown on websites", "Certifies the company for three years"], "Type I checks that controls are suitably designed and in place on a specific date. Type II also tests that they operated effectively over a period."],
  ["Is SOC 2 a certification?", "No, it's an attestation report by a CPA firm", ["Yes, valid for three years like ISO", "Yes, issued directly by the AICPA", "Yes, but only for US companies"], "A SOC 2 is an auditor's opinion (attestation), not a certificate. Customers read the report, including any exceptions, to judge the vendor's controls."],
  ["Who usually asks a company for its SOC 2 report?", "Customers checking a vendor's controls", ["Tax authorities checking accounts", "The company's own new employees", "Its internet service provider"], "SOC 2 is mainly a trust document for B2B customers, especially for SaaS and cloud vendors handling their data."],
  ["How long is a typical SOC 2 Type II observation period?", "3 to 12 months", ["A single day", "One week", "Five years"], "Type II reports cover a period, commonly 6 or 12 months; first reports are sometimes 3 months. A single date would be a Type I."],
  ["SOC 2 'Common Criteria' (CC1-CC9) belong to which category?", "Security", ["Privacy", "Availability", "Confidentiality"], "The Common Criteria make up the Security category and apply to every SOC 2. They cover areas like control environment, risk assessment, logical access and change management."],
  ["Uptime commitments and disaster recovery fit which SOC 2 category?", "Availability", ["Confidentiality", "Processing Integrity", "Privacy"], "Availability covers whether systems are available for use as committed, including capacity, backups and recovery."],
  ["Which SOC 2 category deals with collecting, using and disposing of personal information?", "Privacy", ["Confidentiality", "Security", "Availability"], "Privacy covers personal information about individuals. Confidentiality covers information the organisation has agreed to keep confidential, such as business data."],
  ["What is an 'exception' in a SOC 2 Type II report?", "A test where a control didn't work as described", ["A control the auditor chose to skip", "A customer exempt from the contract", "A system outside the report's scope"], "An exception means the auditor found a sample where the control failed, e.g. a leaver whose access wasn't removed. Readers should check how serious it is."],
  ["In a SOC 2 report, the 'system description' is:", "Management's account of its services, systems and controls", ["The auditor's own diagram of the whole network", "A list of the vendor's biggest customers by size", "The vendor's sales and marketing brochure"], "Management writes the description of the system (services, infrastructure, people, processes, data and controls). The auditor gives an opinion on it."],
  ["An auditor asks for evidence that new hires completed security training. What is good evidence?", "Training records with names and completion dates", ["A verbal confirmation from the HR manager", "The training slide deck that staff were shown", "A screenshot of the learning platform's home page"], "Good evidence ties each sampled person to a completed item and a date. Slides show the content exists, not that people completed it."],
  ["SOC 1 differs from SOC 2 because SOC 1 focuses on:", "Controls relevant to customers' financial reporting", ["Security of the vendor's public websites only", "Personal data handled under GDPR rules", "Physical security of the vendor's office buildings"], "SOC 1 supports customers' financial statement audits (e.g. a payroll provider). SOC 2 covers security and the other trust criteria."],
  ["Compliance platforms such as Vanta or Drata mainly help with SOC 2 by:", "Collecting evidence and monitoring controls continuously", ["Issuing the final SOC 2 report themselves", "Replacing the CPA firm as the official auditor", "Removing the need for any written policies"], "These tools connect to cloud, HR and code systems to gather evidence and flag control failures. A CPA firm still performs the audit and issues the report."],
  ["How are SOC 2 reports usually shared?", "Under NDA with customers and prospects", ["Publicly on the company's website", "Only with the company's own board", "Only with government regulators"], "SOC 2 reports contain control detail, so they're restricted-use and shared under NDA. A SOC 3 is the short general-use version that can be public."],
  ["Which SOC 2 report do customers usually prefer, and why?", "Type II, because it shows controls worked over time", ["Type I, because it covers a longer period", "Type I, because it can be shared publicly", "Type II, because it is a formal certification"], "A Type II tests operating effectiveness across a period, so it gives more assurance than a Type I snapshot. Neither is a certification, and both are restricted-use."],
]});

QX.push({ m: "gdpr", q: [
  ["What is 'personal data' under GDPR?", "Any information about an identifiable living person", ["Only people's names and home addresses", "Only data that is labelled as confidential", "Only customer data, never employee data"], "Personal data includes names, emails, IP addresses, location data, photos and online identifiers: anything that can identify someone directly or indirectly."],
  ["Under GDPR, who is the 'data subject'?", "The living person the personal data is about", ["The company that decides how data is used", "The regulator that enforces the GDPR", "The database that stores the personal data"], "The data subject is the identified or identifiable individual. GDPR gives them rights such as access, rectification, erasure and objection."],
